version: 1
name: "Default Dark"
author: "Built-in"
description: "VS Code-inspired dark theme"

ui:
  editor:
    background: "#1E1E1E"
    foreground: "#D4D4D4"
    current_line_background: "#2A2A2A"
    cursor_color: "#FCE146"
    selection_background: "#264F78"
    secondary_cursor_color: "#FFFFFF80"

  gutter:
    background: "#1E1E1E"
    foreground: "#858585"
    foreground_active: "#C6C6C6"
    border_color: "#313438"

  status_bar:
    background: "#007ACC"
    foreground: "#FFFFFF"
    border: "#313438"

  sidebar:
    background: "#252526"
    foreground: "#CCCCCC"
    selection_background: "#FFFFFF1A"
    selection_foreground: "#FFFFFF"
    hover_background: "#FFFFFF0D"
    folder_icon: "#DCDC8B"
    file_icon: "#9CDCFE"
    border: "#3C3C3C"

  splitter:
    background: "#252526"

  tab_bar:
    background: "#252526"
    active_background: "#1E1E1E"
    active_foreground: "#FFFFFF"
    inactive_background: "#2D2D2D"
    inactive_foreground: "#808080"
    border: "#3C3C3C"
    modified_indicator: "#FFFFFF"

  overlay:
    border: "#43454A"
    background: "#2B2D30"
    foreground: "#E0E0E0"
    input_background: "#1E1E1E"
    selection_background: "#264F78"
    highlight: "#80FF80"
    warning: "#FFFF80"
    error: "#FF8080"
    # overlay-surface.md Phase 1 palette (OverlaySurface chrome/rows/keycaps).
    accent: "#007ACC"
    accent_bright: "#4DAAFF"
    panel_background: "#26282C"
    panel_secondary: "#222327"
    recessed_wash: "#1F2124"
    hairline: "#3C3E42"
    selection_wash: "#3D6B8F"
    match_on_selection: "#C9E4FF"
    text_primary: "#ECECEE"
    text_bright: "#FFFFFF"
    text_secondary: "#C9CBCF"
    text_dim: "#8D9198"
    keycap_bg: "#35373C"
    keycap_border: "#4A4D53"
    keycap_fg: "#A5A8AE"
    severity_error: "#F14C4C"
    severity_warning: "#CCA700"
    severity_info: "#3794FF"
    severity_hint: "#8D9198"
    severity_error_text: "#E8A0A0"
    severity_warning_text: "#E0C880"
    severity_info_text: "#A0CCFF"
    severity_hint_text: "#8D9198"

  csv:
    header_background: "#2D2D2D"
    header_foreground: "#E0E0E0"
    grid_line: "#404040"
    selected_cell_background: "#264F7880"
    selected_cell_border: "#007ACC"
    number_foreground: "#B5CEA8"

  image_preview:
    checkerboard_light: "#333333"
    checkerboard_dark: "#2A2A2A"
    checkerboard_size: 8

  scrollbar:
    track: "#1E1E1E"
    thumb: "#424242"
    thumb_hover: "#5A5A5A"

  syntax:
    keyword: "#C586C0"
    function: "#DCDCAA"
    function_builtin: "#DCDCAA"
    string: "#CE9178"
    number: "#B5CEA8"
    comment: "#6A9955"
    type: "#4EC9B0"
    variable: "#9CDCFE"
    variable_builtin: "#569CD6"
    property: "#9CDCFE"
    operator: "#D4D4D4"
    punctuation: "#D4D4D4"
    constant: "#569CD6"
    tag: "#569CD6"
    attribute: "#9CDCFE"
    escape: "#D7BA7D"
    label: "#D7BA7D"
    text: "#D4D4D4"
    text_emphasis: "#D4D4D4"
    text_strong: "#D4D4D4"
    text_title: "#569CD6"
    text_uri: "#3E9CD6"
