version: 1
name: "GitHub Light"
author: "Built-in"
description: "GitHub's light theme"

ui:
  editor:
    background: "#FFFFFF"
    foreground: "#24292F"
    current_line_background: "#F6F8FA"
    cursor_color: "#0969DA"
    selection_background: "#ADD6FF"
    secondary_cursor_color: "#0969DA80"

  gutter:
    background: "#FFFFFF"
    foreground: "#8C959F"
    foreground_active: "#24292F"
    border_color: "#D0D7DE"

  status_bar:
    background: "#F6F8FA"
    foreground: "#57606A"
    border: "#D0D7DE"

  sidebar:
    background: "#F6F8FA"
    foreground: "#24292F"
    selection_background: "#0000001A"
    selection_foreground: "#24292F"
    hover_background: "#0000000D"
    folder_icon: "#953800"
    file_icon: "#0550AE"
    border: "#D0D7DE"

  splitter:
    background: "#D0D7DE"

  tab_bar:
    background: "#F6F8FA"
    active_background: "#FFFFFF"
    active_foreground: "#24292F"
    inactive_background: "#EAEEF2"
    inactive_foreground: "#57606A"
    border: "#D0D7DE"
    modified_indicator: "#24292F"

  overlay:
    border: "#D0D7DE"
    background: "#F0F0F0E0"
    foreground: "#24292F"
    input_background: "#FFFFFF"
    selection_background: "#ADD6FF"
    highlight: "#1A7F37"
    warning: "#9A6700"
    error: "#CF222E"
    # Light neutral chrome with blue selection and dark, readable secondary text.
    accent: "#0969DA"
    accent_bright: "#0550AE"
    panel_background: "#F0F0F0E0"
    panel_secondary: "#EAEEF2"
    recessed_wash: "#E2E7ED"
    hairline: "#D0D7DE"
    selection_wash: "#DDEBFF"
    match_on_selection: "#0A3069"
    text_primary: "#24292F"
    text_bright: "#1B1F24"
    text_secondary: "#46515E"
    text_dim: "#505963"
    keycap_bg: "#EAEEF2"
    keycap_border: "#AFB8C1"
    keycap_fg: "#424A53"
    severity_error: "#CF222E"
    severity_warning: "#9A6700"
    severity_info: "#0969DA"
    severity_hint: "#57606A"
    severity_error_text: "#950E20"
    severity_warning_text: "#744500"
    severity_info_text: "#033D8B"
    severity_hint_text: "#424A53"

  csv:
    header_background: "#F6F8FA"
    header_foreground: "#24292F"
    grid_line: "#D0D7DE"
    selected_cell_background: "#ADD6FF80"
    selected_cell_border: "#0969DA"
    number_foreground: "#0550AE"

  image_preview:
    checkerboard_light: "#FFFFFF"
    checkerboard_dark: "#F0F0F0"
    checkerboard_size: 8

  scrollbar:
    track: "#F6F8FA"
    thumb: "#D0D7DE"
    thumb_hover: "#B1BAC4"

  syntax:
    keyword: "#CF222E"
    function: "#8250DF"
    function_builtin: "#8250DF"
    string: "#0A3069"
    number: "#0550AE"
    comment: "#6E7781"
    type: "#953800"
    variable: "#24292F"
    variable_builtin: "#953800"
    property: "#0550AE"
    operator: "#24292F"
    punctuation: "#24292F"
    constant: "#0550AE"
    tag: "#116329"
    attribute: "#0550AE"
    escape: "#CF222E"
    label: "#953800"
    text: "#24292F"
    text_emphasis: "#24292F"
    text_strong: "#24292F"
    text_title: "#0969DA"
    text_uri: "#0969DA"
