version: 1
name: "Nord"
author: "Built-in"
description: "Arctic, north-bluish color palette with dimmed pastels"

ui:
  editor:
    indent_guide: "#4C566A"
    background: "#2E3440"
    foreground: "#D8DEE9"
    current_line_background: "#3B4252"
    cursor_color: "#D8DEE9"
    selection_background: "#434C5E"
    secondary_cursor_color: "#D8DEE980"

  gutter:
    background: "#2E3440"
    foreground: "#4C566A"
    foreground_active: "#D8DEE9"
    border_color: "#3B4252"

  status_bar:
    background: "#3B4252"
    foreground: "#D8DEE9"
    border: "#4C566A"

  sidebar:
    background: "#2E3440"
    foreground: "#D8DEE9"
    selection_background: "#3B4252"
    selection_foreground: "#ECEFF4"
    hover_background: "#FFFFFF0D"
    folder_icon: "#EBCB8B"
    file_icon: "#81A1C1"
    border: "#3B4252"

  splitter:
    background: "#3B4252"

  tab_bar:
    background: "#2E3440"
    active_background: "#3B4252"
    active_foreground: "#ECEFF4"
    inactive_background: "#2E3440"
    inactive_foreground: "#4C566A"
    border: "#3B4252"
    modified_indicator: "#ECEFF4"

  overlay:
    border: "#4C566A"
    background: "#3B4252"
    foreground: "#D8DEE9"
    input_background: "#2E3440"
    selection_background: "#434C5E"
    highlight: "#A3BE8C"
    warning: "#EBCB8B"
    error: "#BF616A"
    # Polar-night chrome, frost selection and snow-colored text.
    accent: "#88C0D0"
    accent_bright: "#8FBCBB"
    panel_background: "#3B4252"
    panel_secondary: "#343B49"
    recessed_wash: "#2E3440"
    hairline: "#4C566A"
    selection_wash: "#3E5060"
    match_on_selection: "#E0F4F4"
    text_primary: "#ECEFF4"
    text_bright: "#FFFFFF"
    text_secondary: "#D8DEE9"
    text_dim: "#B0BACB"
    keycap_bg: "#434C5E"
    keycap_border: "#69768B"
    keycap_fg: "#ECEFF4"
    severity_error: "#E899A2"
    severity_warning: "#EBCB8B"
    severity_info: "#88C0D0"
    severity_hint: "#B0BACB"
    severity_error_text: "#F1B7BD"
    severity_warning_text: "#F1D9A5"
    severity_info_text: "#B4DFE8"
    severity_hint_text: "#D8DEE9"

  csv:
    header_background: "#3B4252"
    header_foreground: "#D8DEE9"
    grid_line: "#434C5E"
    selected_cell_background: "#434C5E80"
    selected_cell_border: "#88C0D0"
    number_foreground: "#B48EAD"

  image_preview:
    checkerboard_light: "#3B4252"
    checkerboard_dark: "#2E3440"
    checkerboard_size: 8

  scrollbar:
    track: "#2E3440"
    thumb: "#3B4252"
    thumb_hover: "#4C566A"

  syntax:
    keyword: "#81A1C1"
    function: "#88C0D0"
    function_builtin: "#88C0D0"
    string: "#A3BE8C"
    number: "#B48EAD"
    comment: "#4C566A"
    type: "#8FBCBB"
    variable: "#D8DEE9"
    variable_builtin: "#81A1C1"
    property: "#D8DEE9"
    operator: "#81A1C1"
    punctuation: "#ECEFF4"
    constant: "#5E81AC"
    tag: "#81A1C1"
    attribute: "#8FBCBB"
    escape: "#EBCB8B"
    label: "#D08770"
    text: "#D8DEE9"
    text_emphasis: "#D8DEE9"
    text_strong: "#D8DEE9"
    text_title: "#88C0D0"
    text_uri: "#5E81AC"
