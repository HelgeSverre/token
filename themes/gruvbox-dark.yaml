version: 1
name: "Gruvbox Dark"
author: "Built-in"
description: "Retro groove color scheme with warm, earthy tones"

ui:
  editor:
    background: "#282828"
    foreground: "#EBDBB2"
    current_line_background: "#32302F"
    cursor_color: "#EBDBB2"
    selection_background: "#504945"
    secondary_cursor_color: "#EBDBB280"

  gutter:
    background: "#282828"
    foreground: "#665C54"
    foreground_active: "#EBDBB2"
    border_color: "#3C3836"

  status_bar:
    background: "#504945"
    foreground: "#EBDBB2"
    border: "#3C3836"

  sidebar:
    background: "#1D2021"
    foreground: "#EBDBB2"
    selection_background: "#3C3836"
    selection_foreground: "#EBDBB2"
    hover_background: "#FFFFFF0D"
    folder_icon: "#FABD2F"
    file_icon: "#83A598"
    border: "#3C3836"

  splitter:
    background: "#3C3836"

  tab_bar:
    background: "#1D2021"
    active_background: "#282828"
    active_foreground: "#EBDBB2"
    inactive_background: "#1D2021"
    inactive_foreground: "#928374"
    border: "#3C3836"
    modified_indicator: "#EBDBB2"

  overlay:
    border: "#504945"
    background: "#282828"
    foreground: "#EBDBB2"
    input_background: "#1D2021"
    selection_background: "#504945"
    highlight: "#B8BB26"
    warning: "#FABD2F"
    error: "#FB4934"
    # Warm charcoal chrome, sage selection and cream-colored text.
    accent: "#83A598"
    accent_bright: "#B8D2AD"
    panel_background: "#282828"
    panel_secondary: "#242424"
    recessed_wash: "#1D2021"
    hairline: "#504945"
    selection_wash: "#35443C"
    match_on_selection: "#E2F1C8"
    text_primary: "#EBDBB2"
    text_bright: "#FBF1C7"
    text_secondary: "#D5C4A1"
    text_dim: "#BDAE93"
    keycap_bg: "#3C3836"
    keycap_border: "#665C54"
    keycap_fg: "#EBDBB2"
    severity_error: "#FB6354"
    severity_warning: "#FABD2F"
    severity_info: "#83C2BA"
    severity_hint: "#BDAE93"
    severity_error_text: "#FFADA0"
    severity_warning_text: "#FDDD85"
    severity_info_text: "#B3E0CF"
    severity_hint_text: "#D5C4A1"

  csv:
    header_background: "#3C3836"
    header_foreground: "#EBDBB2"
    grid_line: "#504945"
    selected_cell_background: "#50494580"
    selected_cell_border: "#FABD2F"
    number_foreground: "#D3869B"

  image_preview:
    checkerboard_light: "#3C3836"
    checkerboard_dark: "#32302F"
    checkerboard_size: 8

  scrollbar:
    track: "#282828"
    thumb: "#3C3836"
    thumb_hover: "#504945"

  syntax:
    keyword: "#FB4934"
    function: "#FABD2F"
    function_builtin: "#FABD2F"
    string: "#B8BB26"
    number: "#D3869B"
    comment: "#928374"
    type: "#83A598"
    variable: "#EBDBB2"
    variable_builtin: "#FE8019"
    property: "#83A598"
    operator: "#EBDBB2"
    punctuation: "#EBDBB2"
    constant: "#D3869B"
    tag: "#FB4934"
    attribute: "#B8BB26"
    escape: "#FE8019"
    label: "#FABD2F"
    text: "#EBDBB2"
    text_emphasis: "#EBDBB2"
    text_strong: "#EBDBB2"
    text_title: "#FABD2F"
    text_uri: "#83A598"
