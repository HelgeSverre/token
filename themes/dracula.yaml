version: 1
name: "Dracula"
author: "Built-in"
description: "The iconic dark theme with bold purples, pinks, and cyans"

ui:
  editor:
    indent_guide: "#4B5064"
    background: "#282A36"
    foreground: "#F8F8F2"
    current_line_background: "#44475A"
    cursor_color: "#F8F8F2"
    selection_background: "#44475A"
    secondary_cursor_color: "#F8F8F280"

  gutter:
    background: "#282A36"
    foreground: "#6272A4"
    foreground_active: "#F8F8F2"
    border_color: "#343746"

  status_bar:
    background: "#191A21"
    foreground: "#F8F8F2"
    border: "#343746"

  sidebar:
    background: "#21222C"
    foreground: "#F8F8F2"
    selection_background: "#44475A"
    selection_foreground: "#F8F8F2"
    hover_background: "#FFFFFF0D"
    folder_icon: "#F1FA8C"
    file_icon: "#8BE9FD"
    border: "#343746"

  splitter:
    background: "#343746"

  tab_bar:
    background: "#21222C"
    active_background: "#282A36"
    active_foreground: "#F8F8F2"
    inactive_background: "#21222C"
    inactive_foreground: "#6272A4"
    border: "#343746"
    modified_indicator: "#F8F8F2"

  overlay:
    border: "#6272A4"
    background: "#282A36"
    foreground: "#F8F8F2"
    input_background: "#21222C"
    selection_background: "#44475A"
    highlight: "#50FA7B"
    warning: "#F1FA8C"
    error: "#FF5555"
    # Purple selection and blue-violet chrome; pink, yellow and cyan diagnostics.
    accent: "#BD93F9"
    accent_bright: "#D6B6FF"
    panel_background: "#282A36"
    panel_secondary: "#242630"
    recessed_wash: "#21222C"
    hairline: "#44475A"
    selection_wash: "#463858"
    match_on_selection: "#E9D6FF"
    text_primary: "#F8F8F2"
    text_bright: "#FFFFFF"
    text_secondary: "#D4D2DF"
    text_dim: "#A4A6BC"
    keycap_bg: "#383A4C"
    keycap_border: "#6272A4"
    keycap_fg: "#DEDCEB"
    severity_error: "#FF7979"
    severity_warning: "#F1FA8C"
    severity_info: "#8BE9FD"
    severity_hint: "#A4A6BC"
    severity_error_text: "#FFA8A8"
    severity_warning_text: "#F5FFAA"
    severity_info_text: "#B5F2FF"
    severity_hint_text: "#D4D2DF"

  csv:
    header_background: "#21222C"
    header_foreground: "#F8F8F2"
    grid_line: "#44475A"
    selected_cell_background: "#44475A80"
    selected_cell_border: "#BD93F9"
    number_foreground: "#BD93F9"

  image_preview:
    checkerboard_light: "#3D4051"
    checkerboard_dark: "#333545"
    checkerboard_size: 8

  scrollbar:
    track: "#282A36"
    thumb: "#44475A"
    thumb_hover: "#6272A4"

  syntax:
    keyword: "#FF79C6"
    function: "#50FA7B"
    function_builtin: "#8BE9FD"
    string: "#F1FA8C"
    number: "#BD93F9"
    comment: "#6272A4"
    type: "#8BE9FD"
    variable: "#F8F8F2"
    variable_builtin: "#BD93F9"
    property: "#F8F8F2"
    operator: "#FF79C6"
    punctuation: "#F8F8F2"
    constant: "#BD93F9"
    tag: "#FF79C6"
    attribute: "#50FA7B"
    escape: "#FF79C6"
    label: "#8BE9FD"
    text: "#F8F8F2"
    text_emphasis: "#F1FA8C"
    text_strong: "#FFB86C"
    text_title: "#BD93F9"
    text_uri: "#8BE9FD"
