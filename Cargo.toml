[package]
name = "token"
version = "0.5.1"
edition = "2021"
default-run = "token"
autobins = false
description = "A fast, minimal multi-cursor text editor with syntax highlighting"
homepage = "https://token-editor.com"
repository = "https://github.com/HelgeSverre/token"
license = "MIT"
authors = ["Helge Sverre <helge.sverre@gmail.com>"]
readme = "README.md"
keywords = ["editor", "text-editor", "syntax-highlighting", "terminal", "rust"]
categories = ["text-editors", "development-tools"]
exclude = ["samples/", "docs/", "*.md", "justfile", "assets/icon.png"]

[[bin]]
name = "token"
path = "src/main.rs"

[[bin]]
name = "screenshot"
path = "src/bin/screenshot.rs"

[[bin]]
name = "profile_render"
path = "src/bin/profile_render.rs"

[[bin]]
name = "fake-lsp-server"
path = "src/bin/fake_lsp_server.rs"

[features]
default = []
dhat-heap = ["dhat"]
# Enable debug visualization of damage regions (colored outlines)
damage-debug = []
# Emit tracing spans from PerfStats for external profiler visibility
profile-tracing = []
# Export Chrome trace format (open in ui.perfetto.dev)
profile-chrome = ["profile-tracing", "dep:tracing-chrome"]

[dependencies]
winit = "0.30.12"
softbuffer = "0.4"
ropey = "1.6"

# For font rendering
fontdue = "0.9.3"

# For better error handling
anyhow = "1.0"

# For theming (YAML configuration) and state serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
schemars = "1"

# Tracing (debug instrumentation)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# For clipboard support
arboard = "3.4"

# For native file dialogs
rfd = "0.15"

# For window icon loading
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }

# For CLI argument parsing
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.0.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["io-std", "rt", "sync"] }

# LSP protocol types (serde-only; framing is hand-rolled, see src/lsp/transport.rs)
lsp-types = "0.97"

# For Markdown preview
pulldown-cmark = "0.12"
wry = "0.54"
open = "5"  # For opening URLs in default browser

# For user config directory detection
dirs = "5"

# For file system watching (workspace file tree)
notify = "6.1"
notify-debouncer-mini = "0.4"

# For CSV parsing (RFC 4180 compliant)
csv = "1.3"

# For find/replace regex + whole-word search
regex = "1"

# Syntax highlighting with tree-sitter
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-yaml = "0.6"
tree-sitter-md = "0.5"
tree-sitter-rust = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-javascript = "0.23"

tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"

tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-php = "0.24"

tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-bash = "0.25"

tree-sitter-racket = "0.24"
tree-sitter-ini = "1.4"
tree-sitter-xml = "0.7"
# Vendored: upstream has no committed Rust bindings/Cargo.toml, so it can't be
# used as a git dependency. Canonical grammar: https://github.com/sema-lisp/tree-sitter-sema
# Highlight query synchronized through upstream commit 39a7dc9.
tree-sitter-sema = { path = "vendor/tree-sitter-sema" }

# Vendored because upstream v0.12.3 has an SSH submodule URL that breaks
# cargo fetch in environments without SSH keys configured.
tree-sitter-blade = { path = "vendor/tree-sitter-blade" }
tree-sitter-svelte-ng = "1.0.2"

tree-sitter-just = { git = "https://github.com/casey/tree-sitter-just", rev = "60df3d5b3fda2a22fdb3621226cafab50b763663" }

# Pinned to the project author's grammar until it publishes a release with
# LanguageFn bindings and exported highlight queries.
tree-sitter-applescript = { git = "https://github.com/HelgeSverre/tree-sitter-applescript", rev = "1676f5fe99eee6b6532ab6d13559323c48d26190" }

# Extended language batch (Tree-sitter 0.25 / LanguageFn compatible)
tree-sitter-c-sharp = "0.23.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-lua = "0.5"
tree-sitter-r = "1.3"
tree-sitter-swift = "0.7"
tree-sitter-elixir = "0.3"
tree-sitter-gleam = "1.0"
tree-sitter-solidity = "1.2"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-dart = "0.2"
tree-sitter-julia = "0.23"
tree-sitter-haskell = "0.23"
tree-sitter-ocaml = "0.25"
tree-sitter-d = "0.8"
tree-sitter-objc = "3.0"
tree-sitter-vhdl = "1.4"
tree-sitter-odin = "1.3"
tree-sitter-fish = "3.6"
tree-sitter-asm = "0.24"
# crates.io 1.0.0 passes a GCC warning flag directly to MSVC. Pin the upstream
# cross-platform build-flag fix until a corrected crate release is available.
tree-sitter-scss = { git = "https://github.com/tree-sitter-grammars/tree-sitter-scss", rev = "9ab738d22bb248771d42e8678d1a307d14990df1" }
tree-sitter-cmake = "0.7"
tree-sitter-make = "1.1"
tree-sitter-commonlisp = "0.4"
tree-sitter-zig = "1.1"
tree-sitter-glsl = "0.2"
tree-sitter-graphql = "0.1"
tree-sitter-hcl = "1.1"
tree-sitter-nix = "0.3"
tree-sitter-ada = "0.1"
tree-sitter-erlang = "0.20"
tree-sitter-clojure = "0.1"
tree-sitter-nu = { git = "https://github.com/nushell/tree-sitter-nu", rev = "9467420d184bd2c510378f4cda624eca35dd4590" }
tree-sitter-sed = { git = "https://github.com/mskelton/tree-sitter-sed", rev = "e13f8bccd4e6bc190fa34f3df8b2d576a41ff04d" }
tree-sitter-tcl = { git = "https://github.com/tree-sitter-grammars/tree-sitter-tcl", rev = "850a72ab6436e06645b33b11cfa60cbdb04b1f01" }
tree-sitter-roc = { git = "https://github.com/faldor20/tree-sitter-roc", rev = "68f405426d030a7625392aabf41836c1aad05d33" }
tree-sitter-janet = { git = "https://github.com/GrayJack/tree-sitter-janet", rev = "64db751b233ba44ce06fa6c729701bdf87779011" }
tree-sitter-forth = { git = "https://github.com/AlexanderBrevig/tree-sitter-forth", rev = "7190f2173060d19a2174c96bfb5b7c6f9745512b" }
tree-sitter-proto = { git = "https://github.com/coder3101/tree-sitter-proto", rev = "5a256fe3b6be3bd2ea4d03e1213d847c7093c2e1" }
tree-sitter-dhall = { git = "https://github.com/jbellerb/tree-sitter-dhall", rev = "62013259b26ac210d5de1abf64cf1b047ef88000" }
tree-sitter-pkl = { git = "https://github.com/apple/tree-sitter-pkl", rev = "3486521eb1c2fcb3c9a5e88300215930ee515693" }
tree-sitter-hurl = { git = "https://github.com/pfeiferj/tree-sitter-hurl", rev = "597efbd7ce9a814bb058f48eabd055b1d1e12145" }
tree-sitter-wit = { git = "https://github.com/bytecodealliance/tree-sitter-wit", rev = "cdf07263b136054b413cab449ac7a1d059c27542" }
# The upstream scanner uses GCC-only unused-parameter attributes and does not
# compile with MSVC. Keep the pinned grammar source with a portable local patch.
tree-sitter-sml = { path = "vendor/tree-sitter-sml" }
tree-sitter-nim = { git = "https://github.com/alaviss/tree-sitter-nim", rev = "ac72ba30d16edf0be021588a9301ede4accd6cf4" }
tree-sitter-astro-next = "0.1.1"
arborium-awk = "2.18.1"
arborium-kdl = "2.18.1"
tree-sitter-tera = "0.1"
codebook-tree-sitter-typst = "0.12.1"
tree-sitter-containerfile = "0.9.2"
tree-sitter-wgsl-bevy = "0.1.4"
tree-sitter-sequel = "0.3.11"
# crates.io 0.0.4 invokes Unix compiler/archive flags directly, even on MSVC.
# Keep the released grammar source with a portable cc-rs build script.
tree-sitter-v = { path = "vendor/tree-sitter-v" }

streaming-iterator = "0.1"

# For fuzzy file finder
nucleo-matcher = "0.3"

# Embedded terminal panel: cross-platform PTY spawning + VT100/ANSI terminal
# emulator core (parser + grid + scrollback). Token only renders the
# resulting cell grid via its existing fontdue-based TextPainter.
portable-pty = "0.9"
alacritty_terminal = "0.26"

# Optional: heap profiling
dhat = { version = "0.3", optional = true }

# Optional: Chrome trace export for profiling
tracing-chrome = { version = "0.7", optional = true }

[build-dependencies]
cc = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winres = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSProcessInfo", "NSString"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.bundle]
name = "Token"
identifier = "no.helgesverre.token"
icon = ["assets/icon-packaging.png"]
resources = ["Credits.rtf"]
category = "public.app-category.developer-tools"
copyright = "Copyright (c) Helge Sverre 2026"
publisher = "Helge Sverre"
short_description = "A fast, multi-cursor code editor built in Rust"
long_description = """
Token is a lightweight, high-performance code editor inspired by JetBrains IDEs.
Built entirely in Rust with CPU-based rendering, it features powerful multi-cursor editing,
syntax highlighting via Tree-sitter, customizable themes and keybindings, and a responsive
file tree sidebar. Designed for developers who value speed and simplicity.
"""
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["assets/macos-info.plist"]

# cargo-bundle treats per-binary metadata as a complete override rather than
# inheriting the package table, so keep the desktop binary's native metadata
# explicit here.
[package.metadata.bundle.bin.token]
name = "Token"
identifier = "no.helgesverre.token"
icon = ["assets/icon-packaging.png"]
resources = ["Credits.rtf"]
category = "public.app-category.developer-tools"
copyright = "Copyright (c) Helge Sverre 2026"
publisher = "Helge Sverre"
short_description = "A fast, multi-cursor code editor built in Rust"
long_description = """
Token is a lightweight, high-performance code editor inspired by JetBrains IDEs.
Built entirely in Rust with CPU-based rendering, it features powerful multi-cursor editing,
syntax highlighting via Tree-sitter, customizable themes and keybindings, and a responsive
file tree sidebar. Designed for developers who value speed and simplicity.
"""
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["assets/macos-info.plist"]

[dev-dependencies]
divan = "0.1"
tempfile = "3"

[[bench]]
name = "rope_operations"
harness = false

[[bench]]
name = "glyph_cache"
harness = false

[[bench]]
name = "rendering"
harness = false

[[bench]]
name = "main_loop"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "syntax"
harness = false

[[bench]]
name = "workspace"
harness = false

[[bench]]
name = "hot_paths"
harness = false

# Dev profile: fast compile, basic debugging
[profile.dev]
opt-level = 0
debug = "line-tables-only"  # Faster compile than full debug
incremental = true

# No debug info for dependencies (faster compile)
[profile.dev.package."*"]
debug = false

# Keep startup-critical dependencies fast in `just workspace` while leaving
# Token's own code unoptimized for useful debug behavior.
[profile.dev.package.fontdue]
opt-level = 3

[profile.dev.package."ttf-parser:0.21.1"]
opt-level = 3

# Debugging profile: full debug info when needed (cargo build --profile debugging)
[profile.debugging]
inherits = "dev"
debug = true

# Release profile: optimized, fast compile for local testing
[profile.release]
opt-level = 3
lto = "thin"
strip = false
panic = "abort"

# Dist profile: maximum optimization for distribution
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# Profiling profile: release speed with debug symbols
[profile.profiling]
inherits = "release"
debug = true
lto = false
strip = false
