name: showcase-signature-help
width: 1800
height: 1100
scale: 2.0
theme: github-light
files:
  - path: examples/welcome.go
    cursor_line: 18
    cursor_column: 56
    content: |
      package main

      import "fmt"

      type User struct {
          Name string
          Projects int
      }

      func greeting(user User) string {
          return fmt.Sprintf("Welcome, %s", user.Name)
      }

      func main() {
          user := User{Name: "Ada", Projects: 12}
          fmt.Println(greeting(user))

          // Format the project count for the status message.
          message := fmt.Sprintf("%s has %d projects", user.Name, user.Projects)
          fmt.Println(message)
      }
lsp:
  signature_help:
    activeSignature: 0
    activeParameter: 1
    signatures:
      - label: "Sprintf(format string, a ...any) string"
        documentation:
          kind: markdown
          value: "Sprintf formats according to a format specifier and returns the resulting string."
        parameters:
          - label: "format string"
            documentation: "A format string containing verbs such as %s and %d."
          - label: "a ...any"
            documentation: "Values substituted for the formatting verbs, in order."
