<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkbox · Token UI reference</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="ide.css"><script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script><script src="ide.js"></script></head>
<body><style>
  .check-main .ide-group { max-inline-size:560px; } .check-main .ide-check-row input.focused { outline:1px solid var(--focus); outline-offset:2px; } .check-main .check-detail { display:inline-block; margin-inline-start:8px; color:var(--faint); font-size:11px; } .check-main .ide-footer .grow { min-inline-size:0; }
</style><script>
Mockup.mount({id:"CHECKBOX",title:"Checkbox",status:"Established surface · visual study",description:"The current mark painter appears in compact staged Settings rows; this study keeps the row owner visible.",content:`
<div class="ide-study ide-context check-main"><div class="ide-scene"><div>${Ide.preferences({section:"Editor",title:"Editor",content:`
  <div class="ide-group"><div class="ide-group-title">Display</div><label class="ide-check-row"><input type="checkbox" checked aria-label="Show line numbers"><span>Show line numbers</span></label><label class="ide-check-row"><input class="focused" type="checkbox" checked aria-label="Highlight active line"><span>Highlight active line</span></label><label class="ide-check-row"><input type="checkbox" aria-label="Render whitespace"><span>Render whitespace <span class="check-detail">Tabs and trailing spaces</span></span></label></div>
  <div class="ide-group"><div class="ide-group-title">Indentation</div><label class="ide-check-row"><input type="checkbox" checked aria-label="Show indent guides"><span>Show indent guides</span></label><label class="ide-check-row ide-dependent"><input type="checkbox" checked aria-label="Highlight current indent guide"><span>Highlight the current guide</span></label><label class="ide-check-row ide-dependent"><input type="checkbox" disabled aria-label="Use language indent guides"><span class="dim">Use language-provided guides</span></label></div>`,footer:`<span>Appearance changes are staged until applied.</span><span class="grow"></span><button class="btn quiet" type="button">Reset</button><button class="btn primary" type="button">Apply</button>`})}</div><aside class="ide-notes"><div class="ide-note"><h3>Current scope</h3><p>Token currently paints a supplied square. Form choice state, labels, and row hit testing remain in Settings.</p></div><div class="ide-note"><h3>Dependent rows</h3><p>Related toggles step in beneath their controlling label instead of gaining their own card.</p></div></aside></div>
<div class="ide-states" style="--state-count:4" aria-label="Checkbox paint states"><div class="ide-state"><span class="state-label">Off</span><label class="ide-check-row"><input type="checkbox">Show line numbers</label><p class="ide-state-caption">Unchecked mark</p></div><div class="ide-state"><span class="state-label">On</span><label class="ide-check-row"><input type="checkbox" checked>Show line numbers</label><p class="ide-state-caption">Checked mark</p></div><div class="ide-state"><span class="state-label">Focused sample</span><label class="ide-check-row"><input class="focused" type="checkbox" checked>Show indent guides</label><p class="ide-state-caption">Proposed semantic focus</p></div><div class="ide-state"><span class="state-label">Unavailable</span><label class="ide-check-row"><input type="checkbox" disabled>Use language indent guides</label><p class="ide-state-caption">Disabled visual state</p></div></div></div>`});
</script></body></html>
