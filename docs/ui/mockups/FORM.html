<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Form — Token UI reference</title><link rel="stylesheet" href="shared.css"><style>
 .settings-scene{max-width:960px;margin:0 auto}
 .settings-crumb{padding:9px 14px;border-bottom:1px solid var(--line);color:var(--faint);font-size:11px}.settings-crumb span.current{color:var(--text)}
 .settings-cats{display:flex;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--faint);font-size:11px}.settings-cats span.selected{color:var(--bright)}
 .settings-head{padding:14px 16px 0;display:flex;align-items:baseline;gap:10px}.settings-head h2{margin:0;color:var(--bright);font-size:14px;font-weight:400}.settings-head span{flex:1}.settings-head p{margin:2px 16px 0;font-size:11px;color:var(--faint)}
 .settings-toggle{margin:8px 16px 0;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text)}.checkbox-box{display:grid;place-items:center;width:15px;height:15px;background:var(--control-selected);border:1px solid var(--control-selected-border);border-radius:3px;color:var(--bright)}
 .split{margin:10px 16px 0;display:grid;grid-template-columns:150px 1px minmax(0,1fr);height:214px}
 .record-list{overflow:hidden}.record{padding:8px 10px;position:relative;font-size:12px;color:var(--text)}.record .lang{margin-top:2px;color:var(--faint);font-size:10px}.record.selected{background:var(--control-selected);color:var(--control-selected-fg)}.record.selected .lang{color:#dcecff}.record::after{content:"";position:absolute;right:8px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--teal)}
 .split-line{background:var(--line)}
 .field-pane{padding:0 0 0 16px}
 .field-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}.field-title span{color:var(--bright);font-size:13px}
 .form-row{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;align-items:start;margin:10px 0}.form-row>label{font-size:11px;color:var(--faint);padding-top:7px}
 .input-sample{height:29px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:var(--input-background,var(--editor));font:11px "JetBrains Mono",monospace;color:var(--code-fg)}.input-sample.focused{border-color:var(--focus)}.input-sample .browse{color:var(--faint);font:10px Inter,sans-serif}
 .settings-footer{margin:10px 16px 14px;display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line)}.settings-footer .grow{flex:1}.save-note{font-size:11px;color:var(--faint)}
 .flow-notes{max-width:960px;margin:10px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}.flow-step{background:var(--panel);padding:8px 12px;min-height:44px}.flow-step strong{display:block;font-size:11px;font-weight:400;color:var(--bright);margin-bottom:3px}.flow-step span{font-size:11px;color:var(--faint)}
 </style></head><body><script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script><script>
Mockup.mount({id:'FORM',title:'Form',description:'The Settings form owns a typed disposable draft; validation and save are separate from the rows used to render it.',status:'Established surface · visual study',content:`
 <section class="window settings-scene" aria-label="Language server settings, inline record editor">
  <div class="settings-crumb">Settings <span>›</span> Preferences <span>›</span> <span class="current">Language servers</span></div>
  <nav class="settings-cats" aria-label="Settings categories"><span>All Settings</span><span>Appearance</span><span>Files &amp; Session</span><span class="selected">Language servers</span><span>Completion</span><span>Keymap</span></nav>
  <div class="settings-head"><h2>Language servers</h2><span></span><button class="btn quiet" type="button">+ Add</button></div>
  <p>Connect installed language servers to your files.</p>
  <div class="settings-toggle"><span class="checkbox-box">${Mockup.icon('check',12)}</span> Enable language servers</div>
  <div class="split">
   <nav class="record-list" aria-label="Language server records">
    <div class="record"><div>gopls</div><div class="lang">Go</div></div>
    <div class="record"><div>phpantom</div><div class="lang">PHP</div></div>
    <div class="record selected"><div>rust-analyzer</div><div class="lang">Rust</div></div>
    <div class="record"><div>sema</div><div class="lang">Sema</div></div>
    <div class="record"><div>ty</div><div class="lang">Python</div></div>
   </nav>
   <i class="split-line" aria-hidden="true"></i>
   <form class="field-pane" aria-label="Edit rust-analyzer">
    <div class="field-title"><span>rust-analyzer</span><span class="checkbox-box">${Mockup.icon('check',12)}</span></div>
    <div class="form-row"><label>Server ID</label><div class="input-sample focused" role="textbox" aria-label="Server ID" aria-readonly="true">rust-analyzer</div></div>
    <div class="form-row"><label>Executable</label><div class="input-sample" role="textbox" aria-label="Executable" aria-readonly="true">rust-analyzer<span class="browse">Browse…</span></div></div>
    <div class="form-row"><label>Languages</label><div class="input-sample" role="textbox" aria-label="Languages" aria-readonly="true">Rust</div></div>
   </form>
  </div>
  <footer class="settings-footer"><span class="save-note">Draft · Save applies this server; Cancel leaves it unchanged</span><span class="grow"></span><button type="button" class="btn quiet">Remove</button><button type="button" class="btn quiet">Open log</button><button type="button" class="btn quiet">Cancel</button><button type="button" class="btn primary">Save</button></footer>
 </section>
 <section class="flow-notes" aria-label="Form ownership"><div class="flow-step"><strong>Draft</strong><span>Text, choices and focus live in the form session.</span></div><div class="flow-step"><strong>Validate</strong><span>Build a typed settings change before persistence.</span></div><div class="flow-step"><strong>Apply</strong><span>Runtime performs save and inspection work.</span></div><div class="flow-step"><strong>Repair</strong><span>Matching completion updates this session only.</span></div></section>`});
</script></body></html>
