<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Form — Token UI reference</title><link rel="stylesheet" href="shared.css"><style>
 .modal-scene{max-width:900px;margin:0 auto;position:relative;height:430px;background:var(--editor);border:1px solid var(--line);border-radius:5px;overflow:hidden}.scene-code{padding:22px 28px 20px 72px;color:var(--gutter-fg);font:12px/22px "JetBrains Mono",monospace;opacity:.5}.scene-gutter{position:absolute;left:0;top:18px;width:50px;padding-right:12px;border-right:1px solid var(--line);text-align:right;color:var(--gutter-fg);font:12px/22px "JetBrains Mono",monospace}.scene-scrim{position:absolute;inset:0;background:#0008}.form-modal{position:absolute;left:50%;top:21px;transform:translateX(-50%);width:590px;background:var(--panel);border:1px solid var(--window-border);border-radius:6px;box-shadow:0 16px 36px #000a}.modal-header{height:42px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);color:var(--bright);font-size:13px}.modal-header .grow{flex:1}.modal-body{padding:16px 18px 14px}.form-row{display:grid;grid-template-columns:145px minmax(0,1fr);gap:14px;align-items:start;margin:11px 0}.form-row>label{font-size:12px;color:var(--text);padding-top:7px}.form-row .help{margin-top:4px}.input-sample{height:31px;display:flex;align-items:center;padding:0 9px;border:1px solid var(--line);border-radius:4px;background:var(--input-background,var(--editor));font:12px "JetBrains Mono",monospace;color:var(--code-fg)}.input-sample.focused{border-color:var(--focus)}.checkbox-line{height:31px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text)}.checkbox-box{display:grid;place-items:center;width:15px;height:15px;background:var(--control-selected);border:1px solid var(--control-selected-border);border-radius:3px;color:var(--bright)}.modal-footer{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}.modal-footer .grow{flex:1}.save-note{font-size:11px;color:var(--faint)}.flow-notes{max-width:900px;margin:15px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}.flow-step{background:var(--panel);padding:10px 12px;min-height:50px}.flow-step strong{display:block;font-size:11px;font-weight:400;color:var(--bright);margin-bottom:3px}.flow-step span{font-size:11px;color:var(--faint)}
 </style></head><body><script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script><script>
Mockup.mount({id:'FORM',title:'Form',description:'The Settings form owns a typed disposable draft; validation and save are separate from the rows used to render it.',status:'Established surface · visual study',content:`
 <section class="modal-scene" aria-label="Settings form over a subdued editor"><div class="scene-gutter">84<br>85<br>86<br>87<br>88<br>89<br>90<br>91<br>92</div><div class="scene-code">fn open_settings_form(config: &amp;Config) {<br>&nbsp;&nbsp;let draft = SettingsForm::from_config(config);<br>&nbsp;&nbsp;state.open_form(draft);<br>}<br><br>fn apply_form(form: &amp;SettingsForm) {<br>&nbsp;&nbsp;let change = form.change()?;<br>&nbsp;&nbsp;save(change);<br>}</div><div class="scene-scrim" aria-hidden="true"></div>
 <form class="form-modal" aria-label="Edit language server"><header class="modal-header"><span>Edit language server</span><span class="grow"></span><button class="btn icon-btn" aria-label="Close">${Mockup.icon('close')}</button></header><div class="modal-body"><div class="form-row"><label>Name</label><div><div class="input-sample focused" role="textbox" aria-label="Name" aria-readonly="true">rust-analyzer</div><div class="help">Used to identify this saved configuration.</div></div></div><div class="form-row"><label>Executable</label><div><div class="input-sample" role="textbox" aria-label="Executable" aria-readonly="true">rust-analyzer</div><div class="help">Checked when saving this draft.</div></div></div><div class="form-row"><label>Enabled</label><div class="checkbox-line"><span class="checkbox-box">${Mockup.icon('check',12)}</span> Start for matching Rust documents</div></div><div class="form-row"><label>Arguments</label><div class="input-sample" role="textbox" aria-label="Arguments" aria-readonly="true">--log-file /tmp/ra.log</div></div></div><footer class="modal-footer"><span class="save-note">Unsaved changes</span><span class="grow"></span><button type="button" class="btn quiet">Cancel</button><button type="button" class="btn primary">Save server</button></footer></form></section>
 <section class="flow-notes" aria-label="Form ownership"><div class="flow-step"><strong>Draft</strong><span>Text, choices and focus live in the form session.</span></div><div class="flow-step"><strong>Validate</strong><span>Build a typed settings change before persistence.</span></div><div class="flow-step"><strong>Apply</strong><span>Runtime performs save and inspection work.</span></div><div class="flow-step"><strong>Repair</strong><span>Matching completion updates this session only.</span></div></section>`});
</script></body></html>
