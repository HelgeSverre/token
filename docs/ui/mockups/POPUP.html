<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cursor popup visual reference</title>
    <link rel="stylesheet" href="shared.css">
    <style>
      .popup-stage { height: 410px; display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 18px; }
      .popup-editor { position: relative; min-height: 0; overflow: hidden; }
      .completion { position: absolute; z-index: 4; top: 181px; left: 305px; width: 278px; border: 1px solid var(--tooltip-border); border-radius: 5px; background: var(--tooltip-bg); box-shadow: 0 13px 30px #00000057; padding: 4px; }
      .completion-head { color: var(--faint); font-size: 11px; padding: 5px 8px 6px; border-bottom: 1px solid var(--soft-line); }
      .completion-row { min-height: 34px; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 7px; padding: 0 7px; border-radius: 3px; color: var(--text); font-size: 12px; }
      .completion-row.selected { color: var(--control-selected-fg); background: var(--control-selected); }
      .completion-row .detail { color: var(--faint); font-size: 11px; }
      .completion-row.selected .detail { color: #dcecff; }
      .popup-doc { padding: 14px; }
      .popup-doc h3 { color: var(--bright); font-size: 14px; font-weight: 400; margin: 2px 0 8px; }
      .popup-doc p { font-size: 12px; line-height: 18px; margin: 0 0 11px; color: var(--muted); }
      .popup-doc code { font-family: var(--font-mono); color: var(--syntax-type); font-size: 11px; }
      .popup-flow { display: grid; gap: 9px; padding-top: 12px; border-top: 1px solid var(--soft-line); color: var(--faint); font-size: 11px; }
      .popup-flow span { display: flex; align-items: center; gap: 7px; }
      .popup-flow i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--focus); }
      .popup-states { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }
      .popup-states .state-card { min-height: 80px; padding: 10px; }
      .mini-popup { margin-top: 7px; border: 1px solid var(--soft-line); border-radius: 4px; background: var(--tooltip-bg); padding: 5px; font-size: 11px; color: var(--muted); }
      .mini-row { height: 19px; display: flex; align-items: center; gap: 7px; }
      .mini-row.selected { padding: 0 5px; margin: 0 -1px; border-radius: 2px; background: var(--control-selected); color: var(--bright); }
    </style>
  </head>
  <body>
    <script src="../../../prototypes/debug-performance-themes.js"></script>
    <script src="shared.js"></script>
    <script>
      const source = [
        'pub fn paint(frame: &mut Frame) {',
        '    frame.draw_▏',
        '}',
        '',
        '// Completion is anchored at the query start.',
        'struct OverlaySpec {',
        '    selected: usize,',
        '}'
      ];
      const content = `
        <div class="popup-stage">
          <section class="popup-editor" aria-label="Completion popup in source editor">
            ${Mockup.editor({ title: 'overlay.rs', tabs: ['frame.rs', 'overlay.rs'], breadcrumb: true, sidebar: false, status: true, lines: source })}
            <section class="completion" aria-label="Completion suggestions">
              <div class="completion-head"><span class="mono">draw_</span> · 4 suggestions</div>
              <div class="completion-row selected"><span>${Mockup.icon('code')}</span><span>draw_text</span><span class="detail">fn</span></div>
              <div class="completion-row"><span>${Mockup.icon('code')}</span><span>draw_rect</span><span class="detail">fn</span></div>
              <div class="completion-row"><span>${Mockup.icon('file')}</span><span>draw_path</span><span class="detail">fn</span></div>
              <div class="completion-row"><span>${Mockup.icon('settings')}</span><span>draw_debug</span><span class="detail">fn</span></div>
            </section>
          </section>
          <aside class="surface popup-doc" aria-label="Completion popup context">
            <div class="section-title">Cursor overlay</div>
            <h3>One active popup</h3>
            <p>Completion owns its filtered rows. Its selected index points into this visible command set.</p>
            <p><code>draw_text</code> is selected; a documentation card can appear beside this list when space permits.</p>
            <div class="popup-flow">
              <span><i></i> caret and query establish anchor</span>
              <span><i></i> overlay measures and flips if required</span>
              <span><i></i> Escape closes this owner</span>
            </div>
          </aside>
        </div>
        <div class="popup-states" aria-label="Other cursor popup families">
          <div class="state-card"><div class="state-label">Code actions</div><div class="mini-popup"><div class="mini-row selected">Quick fix…</div><div class="mini-row">Source action…</div></div></div>
          <div class="state-card"><div class="state-label">References</div><div class="mini-popup"><div class="mini-row selected">src/view/frame.rs:84</div><div class="mini-row">src/view/modal.rs:211</div></div></div>
          <div class="state-card"><div class="state-label">Hover</div><div class="mini-popup"><div class="mini-row">OverlaySpec</div><div class="mini-row muted">Render projection</div></div></div>
        </div>`;
      Mockup.mount({
        id: 'POPUP',
        title: 'Cursor popup',
        description: 'Feature-owned overlay content, placed from a live editor anchor.',
        status: 'Established surface · visual study',
        content
      });
    </script>
  </body>
</html>
