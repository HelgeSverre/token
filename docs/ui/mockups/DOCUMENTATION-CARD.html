<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documentation card visual reference</title>
    <link rel="stylesheet" href="shared.css">
    <style>
      .docs-stage { height: 422px; position: relative; }
      .docs-editor { height: 100%; position: relative; min-height: 0; overflow: hidden; }
      .docs-completion { position: absolute; z-index: 3; left: 300px; top: 171px; width: 252px; padding: 4px; border: 1px solid var(--tooltip-border); border-radius: 5px; background: var(--tooltip-bg); box-shadow: 0 12px 26px #00000055; }
      .docs-completion-head { padding: 5px 7px; color: var(--faint); font-size: 10px; border-bottom: 1px solid var(--soft-line); }
      .docs-completion-row { display: grid; grid-template-columns: 15px 1fr auto; gap: 6px; align-items: center; min-height: 29px; padding: 0 6px; font: 11px/14px var(--font-mono); color: var(--text); }
      .docs-completion-row.selected { background: var(--control-selected); color: var(--bright); border-radius: 3px; }
      .docs-completion-row span:last-child { color: var(--faint); font: 10px var(--font-ui); }
      .docs-card { position: absolute; z-index: 3; left: 564px; top: 171px; width: 364px; height: 238px; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); border: 1px solid var(--tooltip-border); border-radius: 5px; background: var(--tooltip-bg); box-shadow: 0 12px 26px #00000055; overflow: hidden; }
      .docs-card-head { padding: 11px 13px 9px; border-bottom: 1px solid var(--soft-line); }
      .docs-card-head .title-line { color: var(--bright); font: 12px/18px var(--font-mono); }
      .docs-card-head .title-line .syn-type { color: var(--syntax-type); }
      .docs-card-head .subline { color: var(--faint); font-size: 11px; }
      .docs-reading { position: relative; min-height: 0; overflow: hidden; padding: 10px 29px 8px 13px; }
      .docs-code { margin: 0 0 8px; padding: 7px 9px; border-left: 2px solid var(--focus); background: var(--editor); color: var(--code-fg); font: 10.5px/15px var(--font-mono); white-space: pre; }
      .docs-prose { color: var(--muted); font-size: 11px; line-height: 16px; }
      .docs-prose p { margin: 6px 0; }
      .docs-prose code { color: var(--syntax-fn); font: 10.5px var(--font-mono); }
      .docs-scroll { position: absolute; inset: 10px 10px 10px auto; width: 8px; border-radius: 4px; background: var(--scrollbar-track); }
      .docs-thumb { position: absolute; left: 1px; right: 1px; top: 26.19%; height: 26.19%; border-radius: 3px; background: var(--scrollbar); }
      .docs-scroll-label { color: var(--faint); font-size: 10px; line-height: 14px; }
      .docs-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
      .docs-bottom .state-card { min-height: 70px; padding: 10px; }
      .docs-bottom p { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 15px; }
    </style>
  </head>
  <body>
    <script src="../../../prototypes/debug-performance-themes.js"></script>
    <script src="shared.js"></script>
    <script>
      const source = [
        'fn layout(spec: &OverlaySpec) {',
        '    let plan = spec.documentation();',
        '    plan.wrap(measure);',
        '}',
        '',
        '// Completion selected: DocumentationViewport',
        'DocumentationViewport::default();'
      ];
      const content = `
        <div class="docs-stage">
          <section class="docs-editor" aria-label="Completion list and documentation side card">
            ${Mockup.editor({ title: 'overlay_surface.rs', tabs: ['modal.rs', 'overlay_surface.rs'], breadcrumb: true, sidebar: false, status: false, lines: source })}
            <section class="docs-completion" aria-label="Completion list">
              <div class="docs-completion-head">documentation</div>
              <div class="docs-completion-row selected"><span>${Mockup.icon('code')}</span><span>DocumentationViewport</span><span>struct</span></div>
              <div class="docs-completion-row"><span>${Mockup.icon('code')}</span><span>DocumentationState</span><span>struct</span></div>
              <div class="docs-completion-row"><span>${Mockup.icon('code')}</span><span>DocumentationScrolled</span><span>enum</span></div>
            </section>
            <aside class="docs-card" aria-label="Documentation for DocumentationViewport">
            <div class="docs-card-head"><div class="title-line"><span class="syn-keyword">struct</span> <span class="syn-type">DocumentationViewport</span></div><div class="subline">src/view/overlay_surface.rs</div></div>
            <div class="docs-reading" data-clip-demo>
              <div class="docs-code">pub struct DocumentationViewport {
    pub scroll: usize,
    pub visible: usize,
    pub total: usize,
}</div>
              <div class="docs-prose"><p>A measured reading viewport for completion and hover documentation.</p><p><code>scroll</code> is a wrapped rendered-line index; <code>visible</code> and <code>total</code> come from this measured layout.</p></div>
              <span class="docs-scroll" aria-hidden="true"><span class="docs-thumb"></span></span>
            </div>
            </aside>
          </section>
        </div>
        <div class="docs-bottom" aria-label="Documentation card relationships">
          <div class="state-card"><div class="state-label">Completion side card · lines 12–22 of 42</div><p>Follows the selected filtered completion item and resets its reading position when selection changes.</p></div>
          <div class="state-card"><div class="state-label">Hover reading surface</div><p>Uses the hover owner’s live text-cell anchor; it is not a global fetchable card.</p></div>
        </div>`;
      Mockup.mount({
        id: 'DOCUMENTATION-CARD',
        title: 'Documentation card',
        description: 'A feature-owned reading surface shown beside the selected completion item.',
        status: 'Established surface · visual study',
        content
      });
    </script>
  </body>
</html>
