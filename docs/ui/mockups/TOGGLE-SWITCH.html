<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Toggle switch · Token UI reference</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="ide.css"><script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script><script src="ide.js"></script></head>
<body><style>
  .switch-main .live-tools { padding:10px 12px; border-block-end:1px solid var(--line); } .switch-main .live-body { padding:10px 18px 14px; } .switch-main .live-title { display:flex; align-items:center; min-block-size:30px; color:var(--bright); font-size:12px; } .switch-main .live-title .status-dot { inline-size:7px; block-size:7px; margin-inline-end:8px; border-radius:50%; background:var(--syntax-comment); } .switch-main .switch-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:16px; min-block-size:43px; border-block-start:1px solid var(--soft-line); font-size:12px; } .switch-main .switch-row small { display:block; color:var(--faint); font-size:11px; margin-block-start:1px; } .switch-main input.switch[type="checkbox"] { appearance:none; position:relative; inline-size:30px; block-size:16px; margin:0; border:1px solid var(--line); border-radius:10px; background:var(--control-bg); } .switch-main input.switch[type="checkbox"]::before { content:none !important; } .switch-main .switch::after { content:""; position:absolute; inset-block-start:2px; inset-inline-start:2px; inline-size:10px; block-size:10px; border-radius:50%; background:var(--muted); } .switch-main input.switch[type="checkbox"]:checked { background:var(--control-selected-border) !important; border-color:var(--control-selected-border) !important; } .switch-main .switch:checked::after { inset-inline-start:16px; background:var(--bright); } .switch-main .switch.focused { outline:1px solid var(--focus); outline-offset:2px; } .switch-main .switch:disabled { opacity:.42; }
</style><script>
Mockup.mount({id:"TOGGLE-SWITCH",title:"Toggle switch",status:"Proposed component",description:"A possible immediate-effect control for a live tool surface; it is deliberately separate from staged Settings checkboxes.",content:`
<div class="ide-study ide-context switch-main"><div class="ide-scene"><section class="ide-window ide-context" aria-label="Language services live panel"><header class="ide-titlebar">Language services <span class="grow"></span><span class="ide-path">token-editor</span></header><div class="live-tools ide-toolstrip"><button class="btn icon-btn" type="button" aria-label="Restart language server">${Mockup.icon('refresh',14)}</button><button class="btn" type="button">Restart server</button><span class="ide-tool-separator"></span><span class="dim">rust-analyzer</span><span class="grow"></span><span class="badge">Connected</span></div><div class="live-body"><div class="live-title"><span class="status-dot"></span>Live analysis preview</div><label class="switch-row"><span>Publish diagnostics<small>Update the Problems tool window while you edit.</small></span><input class="switch" type="checkbox" checked aria-label="Publish diagnostics"></label><label class="switch-row"><span>Inline type hints<small>Show inference in the current document.</small></span><input class="switch focused" type="checkbox" checked aria-label="Inline type hints"></label><label class="switch-row"><span>Document symbols<small>Keep the outline synchronized with this file.</small></span><input class="switch" type="checkbox" aria-label="Document symbols"></label><label class="switch-row"><span>Experimental semantic tokens<small>Available after the server advertises support.</small></span><input class="switch" type="checkbox" disabled aria-label="Experimental semantic tokens"></label></div><footer class="ide-footer"><span>Changes take effect in this connected session.</span></footer></section><aside class="ide-notes"><div class="ide-note"><h3>Proposed live affordance</h3><p>A switch suits an immediate, reversible effect in a tool or preview surface. It does not replace Token's staged Settings checkbox rows.</p></div><div class="ide-note"><h3>Current boundary</h3><p>ToggleMaster is a domain action; Token has no shared track, thumb, or switch input contract today.</p></div></aside></div>
<div class="ide-states" style="--state-count:4" aria-label="Proposed switch states"><div class="ide-state"><span class="state-label">Off</span><label class="ide-check-row"><input class="switch" type="checkbox">Symbols</label><p class="ide-state-caption">No live effect</p></div><div class="ide-state"><span class="state-label">On</span><label class="ide-check-row"><input class="switch" checked type="checkbox">Symbols</label><p class="ide-state-caption">Enabled live effect</p></div><div class="ide-state"><span class="state-label">Focused</span><label class="ide-check-row"><input class="switch focused" checked type="checkbox">Symbols</label><p class="ide-state-caption">Future focus projection</p></div><div class="ide-state"><span class="state-label">Unavailable</span><label class="ide-check-row"><input class="switch" disabled type="checkbox">Semantic tokens</label><p class="ide-state-caption">Feature capability absent</p></div></div></div>`});
</script></body></html>
