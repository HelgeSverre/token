<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity rail · Token UI reference</title>
  <link rel="stylesheet" href="shared.css">
  <script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script>
  <style>
    .rail-study { display:grid; grid-template-columns:minmax(0,1fr) 286px; gap:18px; height:100%; min-height:0; }
    .rail-shell { display:grid; grid-template-columns:42px minmax(0,1fr) 42px; min-height:0; border:1px solid var(--window-border,#3c3c3c); background:var(--editor,#1e1e1e); }
    .rail { display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px; background:var(--panel,#252526); }
    .rail.left { border-right:1px solid var(--line,#3c3c3c); } .rail.right { border-left:1px solid var(--line,#3c3c3c); }
    .rail-spacer { flex:1; }
    .rail-cell { position:relative; display:grid; place-items:center; width:31px; height:31px; padding:0; border:1px solid transparent; border-radius:4px; color:var(--muted,#c9cbcf); background:transparent; }
    .rail-cell.selected { color:var(--bright,#fff); border-color:rgba(255,255,255,.12); background:var(--control-selected,#264f78); } .rail-cell.focused { outline:1px solid var(--focus,#4daaff); outline-offset:1px; } .rail-cell.open:not(.selected) { box-shadow:inset 2px 0 0 var(--control-selected-border,#007acc); } .rail.right .rail-cell.open:not(.selected) { box-shadow:inset -2px 0 0 var(--control-selected-border,#007acc); }
    .badge-count { position:absolute; top:-4px; right:-5px; min-width:12px; height:12px; display:grid; place-items:center; padding:0 2px; border-radius:7px; background:var(--red,#ff8080); color:#1e1e1e; font:8px/12px "JetBrains Mono",monospace; }
    .rail-main { display:grid; grid-template-rows:35px 30px minmax(0,1fr) 25px; min-width:0; }.rail-tabs { display:flex; align-items:end; padding-left:10px; gap:2px; background:var(--tabs-bg,#252526); border-bottom:1px solid var(--line,#3c3c3c); }.rail-tabs span { height:34px; display:flex; align-items:center; padding:0 11px; color:var(--bright,#fff); font-size:11px; border:1px solid var(--line,#3c3c3c); border-bottom:0; background:var(--editor,#1e1e1e); }.rail-crumb { display:flex; align-items:center; gap:7px; padding:0 12px; border-bottom:1px solid var(--line,#3c3c3c); color:var(--muted,#c9cbcf); font-size:11px; }.rail-code { padding:13px 0 0 45px; color:var(--code-fg,#d4d4d4); font:12px/21px "JetBrains Mono",monospace; }.rail-code div{white-space:pre;}.rail-code .kw{color:var(--syntax-keyword,#c586c0)}.rail-code .cm{color:var(--syntax-comment,#6a9955)}.rail-status { display:flex; align-items:center; justify-content:space-between; padding:0 10px; background:var(--status-bg,#007acc); color:var(--status-fg,#fff); font-size:10px; }
    .rail-notes { display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:8px; min-height:0; }.deferred { padding:11px; border-left:2px solid var(--amber,#ffff80); background:rgba(255,255,255,.025); color:var(--muted,#c9cbcf); font-size:11px; line-height:16px; }.deferred strong{color:var(--bright,#fff);font-weight:400}.state-card { padding:9px; border:1px solid var(--line,#3c3c3c); background:var(--panel,#252526); }.state-title{margin-bottom:6px;color:var(--faint,#8d9198);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.state-row{display:flex;gap:8px;align-items:center;color:var(--muted,#c9cbcf);font-size:10px}.mini-rail{display:flex;gap:5px;padding:7px;border:1px solid var(--soft-line,#313438);background:var(--editor,#1e1e1e)}.mini-cell{width:24px;height:24px;display:grid;place-items:center;color:var(--muted,#c9cbcf);border-radius:3px}.mini-cell.sel{color:var(--bright,#fff);background:var(--control-selected,#264f78)}.mini-cell.focus{outline:1px solid var(--focus,#4daaff);outline-offset:1px}.placement-list{display:grid;gap:8px;padding:11px;border:1px solid var(--line,#3c3c3c);background:var(--panel,#252526);color:var(--muted,#c9cbcf);font-size:11px;line-height:15px}.placement-list span{display:flex;justify-content:space-between}.placement-list code{color:var(--faint,#8d9198);font:10px "JetBrains Mono",monospace}
  </style>
</head>
<body>
  <script>
    (() => {
      const i = n => Mockup.icon(n, 16);
      const cell = (name, label, state='', badge='') => `<button class="rail-cell ${state}" aria-label="${label}" title="${label}"${badge ? ' data-clip-demo' : ''}>${i(name)}${badge ? `<b class="badge-count">${badge}</b>` : ''}</button>`;
      const content = `<div class="rail-study"><section class="rail-shell" aria-label="Deferred activity rail placement study"><nav class="rail left" aria-label="Left activity rail">${cell('folder','Explorer','selected')}${cell('code','Outline')}${cell('play','Task Runner','open')}<i class="rail-spacer"></i>${cell('chart','Ai Chat')}</nav><main class="rail-main"><div class="rail-tabs"><span>chrome.rs</span></div><div class="rail-crumb">src <span>›</span> layout <span>›</span> chrome.rs</div><div class="rail-code"><div><span class="kw">pub fn</span> render_shell() {</div><div>    <span class="cm">// Both rails are a spatial study only.</span></div><div>    solve_work_area();</div><div>    paint_editor();</div><div>}</div><br><div><span class="kw">fn</span> panel_access() {</div><div>    reveal_or_focus(panel);</div><div>}</div></div><footer class="rail-status"><span>Rust</span><span>Ln 118, Col 9</span></footer></main><nav class="rail right" aria-label="Right activity rail">${cell('chart','Performance','open')}${cell('warning','Problems','focused','3')}${cell('terminal','Terminal')}<i class="rail-spacer"></i>${cell('more','More panels')}</nav></section><aside class="rail-notes"><div class="deferred"><strong>Deferred concept.</strong><br>Both edges are illustrated so placement can be reasoned about, but Token has no activity-rail state, layout key, or renderer today.</div><div class="state-card"><div class="state-title">Named states</div><div class="mini-rail"><span class="mini-cell sel">${i('folder')}</span><span class="mini-cell focus">${i('warning')}</span><span class="mini-cell">${i('terminal')}</span></div><div class="state-row"><span>Selected derives from the active host; focus remains independently visible.</span></div></div><div class="placement-list"><span><b>Left edge</b><code>Explorer</code></span><span><b>Right edge</b><code>Performance</code></span><span><b>Named overflow</b><code>Menu</code></span><span><b>Panel identity</b><code>host-owned</code></span></div><div class="state-card"><div class="state-title">Overflow — H=210</div><div class="mini-rail">${['folder'].map(n=>`<span class="mini-cell sel">${i(n)}</span>`).join('')}<span class="mini-cell" aria-label="More panels" title="More panels">${i('more')}</span></div><div class="state-row"><span>One entry plus a reserved overflow cell fits 40+128+12=180px of the 210px rail; the overflow cell opens a menu naming the seven hidden panels.</span></div><div class="state-row" style="flex-wrap:wrap;gap:4px 8px"><span class="muted">Hidden, named in the menu:</span>${['Outline','Terminal','Task Runner','Ai Chat','Todo List','Problems','Usages'].map(n=>`<code>${n}</code>`).join(', ')}</div></div></aside></div>`;
      Mockup.mount({ id:'ACTIVITY-RAIL', title:'Activity rail', description:'A deferred edge-aligned panel-access concept, shown on both sides of an editor work area.', status:'Deferred concept', content });
    })();
  </script>
</body>
</html>
