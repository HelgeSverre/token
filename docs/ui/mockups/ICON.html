<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Icon · Token UI reference</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="ide.css"><style>
.icon-scene { grid-template-columns:minmax(0,1fr) 224px; }.icon-host { block-size:100%; }.icon-layout { flex:1; min-block-size:0; display:grid; grid-template-columns:222px minmax(0,1fr); }.icon-explorer { background:var(--sidebar-bg); border-inline-end:1px solid var(--line); min-block-size:0; }.icon-panel-head { min-block-size:32px; display:flex; align-items:center; padding-inline:10px; gap:5px; border-block-end:1px solid var(--line); font-size:12px; color:var(--title-fg); }.icon-panel-head .grow,.icon-global-status .grow,.icon-problem-head .grow { flex:1; }.icon-explorer .tree-row { block-size:25px; }.icon-editor { display:flex; flex-direction:column; min-block-size:0; background:var(--editor); }.icon-editor .editor-tabs { min-block-size:34px; }.icon-editor .editor-tab { padding-block:7px; }.icon-editor .breadcrumb { min-block-size:28px; padding-block:5px; }.icon-problem-list { flex:none; min-block-size:96px; border-block-start:1px solid var(--line); background:var(--panel); }.icon-problem-head { min-block-size:27px; display:flex; align-items:center; gap:7px; padding-inline:10px; border-block-end:1px solid var(--line); color:var(--text); font-size:12px; }.icon-problem-row { min-block-size:22px; display:grid; grid-template-columns:17px minmax(0,1fr) 74px 42px; gap:6px; align-items:center; padding-inline:10px; border-block-end:1px solid var(--soft-line); font-size:11px; color:var(--muted); }.icon-problem-row.selected { background:var(--control-selected); color:var(--control-selected-fg); }.icon-problem-row .detail { color:var(--faint); }.icon-problem-row.selected .detail { color:var(--control-selected-fg); }.severity-error { color:var(--severity-error); }.severity-warning { color:var(--severity-warning); }.icon-global-status { min-block-size:24px; display:flex; align-items:center; gap:7px; padding-inline:10px; background:var(--status-bg); border-block-start:1px solid var(--status-border); color:var(--status-fg); font-size:11px; }.icon-toolcopy { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); }
</style></head><body>
<script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script><script src="ide.js"></script><script>
Mockup.mount({id:'ICON',title:'Icon',description:'Domain-owned icon meaning appears in compact workspace, editor, and tool-window context rather than a global catalog.',status:'Established surface · visual study',content:`
<div class="ide-study"><div class="ide-scene icon-scene"><section class="ide-window ide-context icon-host" aria-label="Token workspace and document context"><header class="ide-titlebar"><span>Token</span><span class="ide-path">token-editor</span><span class="grow"></span><button class="btn quiet icon-btn" aria-label="Search workspace">${Mockup.icon('search')}</button><button class="btn quiet icon-btn" aria-label="Settings">${Mockup.icon('settings')}</button></header><div class="icon-layout"><aside class="icon-explorer"><header class="icon-panel-head"><span>Explorer</span><span class="grow"></span><button class="btn quiet icon-btn" aria-label="New file">${Mockup.icon('file')}</button><button class="btn quiet icon-btn" aria-label="Explorer actions">${Mockup.icon('more')}</button></header><div class="tree-row">${Mockup.icon('chevron-down',11)}<span class="folder">${Mockup.icon('folder',14)}</span><span>token-editor</span></div><div class="tree-row depth-1">${Mockup.icon('chevron-down',11)}<span class="folder">${Mockup.icon('folder',14)}</span><span>src</span></div><div class="tree-row depth-2 selected"><span style="inline-size:11px"></span><span class="file">${Mockup.icon('file',14)}</span><span>renderer.rs</span></div><div class="tree-row depth-2"><span style="inline-size:11px"></span><span class="file">${Mockup.icon('file',14)}</span><span>editor_text.rs</span></div><div class="tree-row depth-1">${Mockup.icon('chevron-right',11)}<span class="folder">${Mockup.icon('folder',14)}</span><span>themes</span></div><div class="tree-row">${Mockup.icon('chevron-right',11)}<span class="folder">${Mockup.icon('folder',14)}</span><span>docs</span></div></aside><main class="icon-editor"><div class="editor-tabs"><div class="editor-tab active">${Mockup.icon('file',14)} renderer.rs <span class="close">${Mockup.icon('close',11)}</span></div><span class="grow"></span></div><nav class="breadcrumb" aria-label="Document location"><span>src</span>${Mockup.icon('chevron-right',10)}<span>view</span>${Mockup.icon('chevron-right',10)}<span class="current">renderer.rs</span>${Mockup.icon('chevron-right',10)}<span class="current">render_dock</span></nav>${Mockup.code({start:191,active:197,lines:['fn render_right_dock_phase(&mut self) {','    Renderer::render_dock(','        &mut self.frame, &mut self.painter,','        self.model, DockPosition::Right,','        &self.plan.chrome,','    );','}']})}<section class="icon-problem-list" aria-label="Problems tool window"><header class="icon-problem-head">${Mockup.icon('warning',14)} <span>Problems</span><span class="badge">3</span><span class="grow"></span><button class="btn quiet icon-btn" aria-label="Problems options">${Mockup.icon('more')}</button></header><div class="icon-problem-row selected"><span class="severity-error">${Mockup.icon('error',14)}</span><span>missing field <span class="mono">current_file_only</span></span><span class="detail">renderer.rs</span><span class="detail">197</span></div><div class="icon-problem-row"><span class="severity-error">${Mockup.icon('error',14)}</span><span>cannot borrow <span class="mono">frame</span> as mutable</span><span class="detail">frame.rs</span><span class="detail">418</span></div><div class="icon-problem-row"><span class="severity-warning">${Mockup.icon('warning',14)}</span><span>unused result from <span class="mono">measure_stage</span></span><span class="detail">perf.rs</span><span class="detail">84</span></div></section></main></div><footer class="icon-global-status">${Mockup.icon('git-branch',12)} main<span class="grow"></span><span>Ln 197, Col 5</span><span>Rust</span></footer></section><aside class="ide-notes"><div class="ide-note"><h3>Producer owns meaning</h3><p>A workspace node provides folder/open state or file extension. A panel provides its <span class="mono">PanelId</span>; paint only receives a resolved glyph.</p></div><div class="ide-note"><h3>Compact actions</h3><p>Tool-window controls use quiet 16px icons with accessible names. They appear beside a title, never as a standalone catalogue.</p></div></aside></div><div class="ide-states" style="--state-count:3"><div class="ide-state"><div class="state-label">Workspace node</div><div class="icon-toolcopy"><span class="folder">${Mockup.icon('folder')}</span><span>src</span><span class="dim">expanded</span></div><p class="ide-state-caption">File tree owns expansion and extension.</p></div><div class="ide-state"><div class="state-label">Tool action</div><div class="icon-toolcopy"><button class="btn quiet icon-btn" aria-label="Search">${Mockup.icon('search')}</button><span>Search workspace</span></div><p class="ide-state-caption">Action stays labelled for accessibility.</p></div><div class="ide-state"><div class="state-label">Problem context</div><div class="icon-toolcopy"><span class="severity-warning">${Mockup.icon('warning')}</span><span>3 diagnostics</span></div><p class="ide-state-caption">Severity is derived from the diagnostic row.</p></div></div></div>`});
</script></body></html>
