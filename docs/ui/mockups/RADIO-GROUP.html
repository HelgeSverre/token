<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Radio group · Token UI reference</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="ide.css"><script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script><script src="ide.js"></script></head>
<body><style>
  .radio-main .ide-group { max-inline-size:520px; } .radio-main .radio-copy { display:flex; flex-direction:column; gap:1px; } .radio-main .radio-copy small { color:var(--faint); font-size:11px; } .radio-main .radio-focus { outline:1px solid var(--focus); outline-offset:2px; }
</style><script>
Mockup.mount({id:"RADIO-GROUP",title:"Radio group",status:"Proposed component",description:"A proposed exclusive choice contract shown as a compact, labelled group rather than repainted Settings buttons.",content:`
<div class="ide-study ide-context radio-main"><div class="ide-scene"><div>${Ide.preferences({section:"Files",title:"Files",content:`
  <div class="ide-group"><div class="ide-group-title">External file changes</div><p class="ide-hint">Choose how an unmodified document responds when its file changes on disk.</p><label class="ide-check-row"><input type="radio" name="reload"><span class="radio-copy"><span>Ask before reloading</span><small>Keep the current document in view until confirmed.</small></span></label><label class="ide-check-row"><input type="radio" name="reload" checked><span class="radio-copy"><span>Reload automatically</span><small>Refresh files with no local modifications.</small></span></label><label class="ide-check-row"><input type="radio" name="reload"><span class="radio-copy"><span>Ignore external changes</span><small>Reload only from the document menu.</small></span></label></div>
  <div class="ide-group"><div class="ide-group-title">Saving</div><label class="ide-check-row"><input type="checkbox" checked aria-label="Keep documents in view"><span>Keep the document in view while reloading</span></label></div>`,footer:`<span>Changes are staged until applied.</span><span class="grow"></span><button class="btn quiet" type="button">Reset</button><button class="btn primary" type="button">Apply</button>`})}</div><aside class="ide-notes"><div class="ide-note"><h3>Why a group?</h3><p>The visible label and one selected option establish a mutually exclusive policy. A segmented control would imply an immediate command choice.</p></div><div class="ide-note"><h3>Still proposed</h3><p>Settings currently uses choice buttons and raw indexes. Token has no radio renderer or reducer; this settings example is illustrative only.</p></div></aside></div>
<div class="ide-states" style="--state-count:3" aria-label="Proposed radio group states"><div class="ide-state"><span class="state-label">Selected option</span><label class="ide-check-row"><input type="radio" checked>Automatic</label><p class="ide-state-caption">One durable selected ID</p></div><div class="ide-state"><span class="state-label">Focused option</span><label class="ide-check-row"><input class="radio-focus" type="radio" checked>Automatic</label><p class="ide-state-caption">Roving focus is future work</p></div><div class="ide-state"><span class="state-label">Unavailable</span><label class="ide-check-row"><input type="radio" disabled>Workspace policy</label><p class="ide-state-caption">Not a selectable fallback</p></div></div></div>`});
</script></body></html>
