<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Progress · Token UI reference</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="ide.css"><style>
.progress-scene{grid-template-columns:minmax(0,1fr) 224px}.progress-workspace{min-block-size:0;display:grid;grid-template-rows:minmax(0,1fr) 168px;background:var(--editor)}.progress-editor{min-block-size:0;display:flex;flex-direction:column}.progress-editor .editor-tabs{min-block-size:34px}.progress-editor .editor-tab{padding-block:7px}.progress-tool{min-block-size:0;border-block-start:1px solid var(--line);background:var(--panel)}.progress-toolhead{min-block-size:32px;display:flex;align-items:center;gap:8px;padding-inline:10px;border-block-end:1px solid var(--line);color:var(--text);font-size:12px}.progress-toolhead .grow{flex:1}.progress-query{display:flex;align-items:center;gap:8px;min-block-size:34px;padding-inline:11px;border-block-end:1px solid var(--soft-line);color:var(--muted);font-size:12px}.progress-query .query-text{color:var(--text)}.progress-query .query-state{margin-inline-start:auto;color:var(--faint);font-size:11px}.progress-row{min-block-size:27px;display:grid;grid-template-columns:18px minmax(0,1fr) 118px 56px;align-items:center;gap:7px;padding-inline:11px;border-block-end:1px solid var(--soft-line);font-size:12px;color:var(--muted)}.progress-row .detail{font-size:11px;color:var(--faint)}.progress-row.pending{color:var(--faint)}.progress-status{min-block-size:25px;display:flex;align-items:center;gap:8px;padding-inline:10px;background:var(--status-bg);border-block-start:1px solid var(--status-border);color:var(--status-fg);font-size:11px}.progress-status .grow{flex:1}.proposed-meter{inline-size:150px;block-size:4px;overflow:hidden;background:var(--control-bg);border-radius:2px}.proposed-meter > span{display:block;block-size:100%;inline-size:37%;background:var(--focus)}
</style></head><body>

Mockup.mount({id:'PROGRESS',title:'Progress',description:'Operations project their own work into a Find, Usages, or status surface; unknown-length work remains textual.',status:'Proposed component',content:`
<div class="ide-study"><div class="ide-scene progress-scene"><section class="ide-window ide-context" aria-label="Find references operation in Token"><header class="ide-titlebar"><span>Token</span><span class="ide-path">src/view/renderer.rs</span><span class="grow"></span><button class="btn quiet icon-btn" aria-label="Stop search">${Mockup.icon('close')}</button><button class="btn quiet icon-btn" aria-label="More editor actions">${Mockup.icon('more')}</button></header><div class="progress-workspace"><div class="progress-editor"><div class="editor-tabs"><div class="editor-tab active">${Mockup.icon('file',14)} renderer.rs</div><div class="editor-tab">${Mockup.icon('file',14)} panels.rs</div><span class="grow"></span></div>${Mockup.code({start:193,active:198,lines:['fn render_right_dock_phase(&mut self) {','    Renderer::render_dock(','        &mut self.frame, &mut self.painter,','        self.model, DockPosition::Right,','        &self.plan.chrome,','    );','}']})}</div><section class="progress-tool" aria-label="Find references tool window"><header class="progress-toolhead">${Mockup.icon('search',15)} <span>Find references</span><span class="grow"></span><button class="btn quiet icon-btn" aria-label="Pin Find references">${Mockup.icon('pin')}</button><button class="btn quiet icon-btn" aria-label="Find references options">${Mockup.icon('more')}</button></header><div class="progress-query">${Mockup.icon('search',14)}<span class="query-text">render_dock</span><span class="query-state">Searching…</span></div><div class="progress-row pending">${Mockup.icon('file',14)}<span>Searching…</span></div></section></div><footer class="progress-status">${Mockup.icon('search',12)} Finding references<span class="grow"></span><span>Ln 198, Col 5</span><span>Rust</span></footer></section><aside class="ide-notes"><div class="ide-note"><h3>Existing, unknown-length work</h3><p>Find and Usages own the query token, source revision, rows, and textual <span class="mono">Searching…</span> projection. They do not fabricate a percent.</p></div><div class="ide-note"><h3>Shared progress is proposed</h3><p>A common bar needs a real consumer, operation ID, generation guard, cancel route, and scope lifetime before it becomes a component.</p></div></aside></div><div class="ide-states" style="--state-count:3"><div class="ide-state"><div class="state-label">Current Find / Usages</div><div class="row">${Mockup.icon('search',14)}<span class="muted">Searching…</span><span class="mono dim">query #8</span></div><p class="ide-state-caption">Text is feature-owned and indeterminate.</p></div><div class="ide-state"><div class="state-label">Proposed known-total projection</div><div class="row"><span class="proposed-meter" role="progressbar" aria-label="Indexing 184 of 497 files" aria-valuemin="0" aria-valuemax="497" aria-valuenow="184"><span></span></span><span class="mono muted">184 / 497</span></div><p class="ide-state-caption">Only use a track when the operation supplies a total.</p></div><div class="ide-state"><div class="state-label">Proposed cancellation</div><div class="row">${Mockup.icon('close',14)}<span class="muted">Cancelling…</span></div><p class="ide-state-caption">The owner checks current operation ID and generation.</p></div></div></div>`});
</script></body></html>
