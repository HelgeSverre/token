<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs · Token UI reference</title><link rel="stylesheet" href="shared.css">
  <style>
    .tabs-study { height:100%; display:grid; grid-template-columns:1.16fr .84fr; grid-template-rows:1fr 1fr; gap:16px; }
    .tab-case { min-height:0; display:grid; grid-template-rows:30px 1fr; overflow:hidden; }.case-label { display:flex; align-items:center; gap:7px; padding:0 10px; border-bottom:1px solid var(--line); font-size:11px; color:var(--faint); letter-spacing:.03em; text-transform:uppercase; }.case-label .case-note { margin-left:auto; letter-spacing:0; text-transform:none; font-size:10px; }
    .doc-tabs { display:flex; align-items:end; gap:1px; height:38px; padding-left:7px; background:var(--tabs-bg); border-bottom:1px solid var(--tab-border); overflow:hidden; }.doc-tab { align-self:stretch; display:flex; align-items:center; gap:6px; min-width:0; padding:0 10px; color:var(--tab-inactive-fg); background:var(--tab-inactive-bg); border-right:1px solid var(--tab-border); font-size:11px; }.doc-tab.active { color:var(--tab-active-fg); background:var(--tab-active-bg); border-top:1px solid var(--focus); }.doc-tab .close { margin-left:7px; display:grid; place-items:center; }.doc-tab.truncated { max-width:125px; }.glyph-clip { overflow:hidden; white-space:nowrap; }.doc-code { padding:9px 12px; font:11px/18px var(--font-mono); color:var(--code-fg); background:var(--editor); height:calc(100% - 38px); }.doc-code .kw { color:var(--syntax-keyword); }.doc-code .ty { color:var(--syntax-type); }.doc-code .fn { color:var(--syntax-fn); }
    .dock-tabbar { display:flex; height:35px; align-items:stretch; padding:0 6px; background:var(--panel); border-bottom:1px solid var(--line); }.dock-tab { display:flex; align-items:center; gap:6px; padding:0 11px; color:var(--faint); font-size:11px; border-bottom:2px solid transparent; }.dock-tab.active { color:var(--bright); border-bottom-color:var(--focus); background:var(--editor); }.dock-body { padding:11px; font-size:11px; color:var(--text); }.problem { display:flex; gap:7px; align-items:center; height:23px; color:var(--muted); }.problem span:first-child { color:var(--severity-warning); }.problem .count { margin-left:auto; color:var(--faint); font-family:var(--font-mono); }
    .terminal-bar { height:34px; display:grid; grid-template-columns:28px 28px minmax(0,1fr) 28px 28px; background:var(--panel); border-bottom:1px solid var(--line); }.terminal-control { display:grid; place-items:center; padding:0; color:var(--faint); background:transparent; border:0; border-right:1px solid var(--line); }.terminal-sessions { min-width:0; display:flex; overflow:hidden; }.terminal-tab { min-width:112px; display:flex; align-items:center; gap:6px; padding:0 9px; font:11px var(--font-mono); color:var(--faint); border-right:1px solid var(--line); }.terminal-tab.active { background:var(--editor); color:var(--bright); }.terminal-tab.exited { color:var(--severity-error-text); }.terminal-out { height:calc(100% - 34px); padding:11px; background:var(--editor); color:var(--code-fg); font:11px/18px var(--font-mono); }.prompt { color:var(--syntax-comment); }
    .overlay-wrap { padding:12px; background:var(--editor); height:100%; box-sizing:border-box; }.overlay-card { border:1px solid var(--tooltip-border); background:var(--tooltip-bg); box-shadow:0 10px 28px rgba(0,0,0,.28); }.overlay-tabs { display:flex; padding:0 9px; border-bottom:1px solid var(--line); gap:12px; }.overlay-tab { padding:10px 1px 8px; color:var(--faint); font-size:11px; border-bottom:2px solid transparent; }.overlay-tab.active { color:var(--bright); border-bottom-color:var(--focus); }.overlay-tab.unavailable { opacity:.5; }.overlay-tab .tab-count { margin-left:5px; color:var(--faint); font-family:var(--font-mono); }.overlay-content { padding:10px 11px; color:var(--muted); font-size:11px; }.overlay-content .result { height:22px; display:flex; align-items:center; gap:7px; }.overlay-content .result:first-child { color:var(--bright); }
    .tabs-study .window { min-height:0; }
  </style>
</head>
<body>
  <script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script>
  <script>
    (() => {
      const i = (n) => Mockup.icon(n, 14);
      Mockup.mount({
        id:'TABS', title:'Tabs', status:'Established surface · visual study',
        description:'Similar tab chrome selects distinct document, dock-panel, terminal-session, and overlay-category identities.',
        content:`
          <div class="tabs-study">
            <section class="window tab-case" aria-label="Document tabs">
              <div class="case-label">Document tabs <span class="case-note">select, close, reorder by document identity</span></div>
              <div><div class="doc-tabs" role="tablist" aria-label="Open documents"><div class="doc-tab active" role="tab" aria-selected="true">${i('file')} <span>editor_text.rs</span><span class="close">${i('close')}</span></div><div class="doc-tab" role="tab">${i('file')} <span>layout.rs</span><span class="close">${i('close')}</span></div><div class="doc-tab truncated" role="tab">${i('file')} <span class="glyph-clip">performance-overlay-notes.md</span></div></div><div class="doc-code"><span class="kw">pub fn</span> <span class="fn">render_visible_rows</span>(<span class="ty">view</span>: &amp;EditorView) {<br>&nbsp;&nbsp;<span class="kw">let</span> rows = view.visible_rows();<br>&nbsp;&nbsp;paint_rows(rows);<br>}</div></div>
            </section>
            <section class="window tab-case" aria-label="Dock tabs">
              <div class="case-label">Dock tabs <span class="case-note">select a panel, no document drag</span></div>
              <div><div class="dock-tabbar" role="tablist" aria-label="Dock panels"><div class="dock-tab active" role="tab" aria-selected="true">${i('warning')} Problems <span class="badge">3</span></div><div class="dock-tab" role="tab">${i('search')} Search</div><div class="dock-tab" role="tab">${i('git-branch')} Git</div></div><div class="dock-body"><div class="problem"><span>${i('warning')}</span><span>unused import</span><span class="count">editor_text.rs:42</span></div><div class="problem"><span>${i('warning')}</span><span>unreachable pattern</span><span class="count">layout.rs:181</span></div><div class="problem"><span>${i('info')}</span><span>3 diagnostics in workspace</span></div></div></div>
            </section>
            <section class="window tab-case" aria-label="Terminal tabs">
              <div class="case-label">Terminal sessions <span class="case-note">fixed controls reserve the overflow edge</span></div>
              <div><div class="terminal-bar"><button class="terminal-control" aria-label="Previous terminal">${i('arrow-left')}</button><button class="terminal-control" aria-label="Next terminal">${i('arrow-right')}</button><div class="terminal-sessions" role="tablist" aria-label="Terminal sessions"><div class="terminal-tab active" role="tab" aria-selected="true">1: shell</div><div class="terminal-tab" role="tab">2: tests</div><div class="terminal-tab exited" role="tab">3: [exited] build</div></div><button class="terminal-control" aria-label="New terminal">${i('plus')}</button><button class="terminal-control" aria-label="Close terminal">${i('close')}</button></div><div class="terminal-out"><span class="prompt">helge@token</span>:<span class="muted">~/code/token-editor</span>$ just test-one layout<br><span class="muted">running 14 tests…</span><br><span style="color:var(--syntax-comment)">test result: ok. 14 passed</span><br><br><span class="muted">terminal-tabs.overflow — viewport narrower than sessions, clipped mid-word:</span><br><div class="terminal-sessions" style="width:150px;border:1px solid var(--line);margin-top:4px;" role="tablist" aria-label="Overflowing terminal sessions"><div class="terminal-tab active" role="tab" aria-selected="true">1: shell</div><div class="terminal-tab" role="tab">2: tests</div><div class="terminal-tab" role="tab">3: cargo wat</div></div></div></div>
            </section>
            <section class="window tab-case" aria-label="Overlay tabs">
              <div class="case-label">Overlay categories <span class="case-note">declarative availability</span></div>
              <div class="overlay-wrap"><div class="overlay-card"><div class="overlay-tabs" role="tablist" aria-label="Command categories"><div class="overlay-tab active" role="tab" aria-selected="true">Files <span class="tab-count">12</span></div><div class="overlay-tab" role="tab">Symbols <span class="tab-count">4</span></div><div class="overlay-tab" role="tab">Commands <span class="tab-count">&hellip;</span></div><div class="overlay-tab unavailable" role="tab" aria-disabled="true">Refs <span class="tab-count">&mdash;</span></div></div><div class="overlay-content"><div class="result">${i('file')} src/view/editor_text.rs</div><div class="result">${i('file')} docs/ui/TABS.md</div><div class="result">${i('file')} src/layout/editor.rs</div></div></div></div>
            </section>
          </div>`
      });
    })();
  </script>
</body>
</html>
