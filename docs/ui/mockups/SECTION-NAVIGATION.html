<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Section navigation — Token UI reference</title><link rel="stylesheet" href="shared.css"><style>
 .preferences{max-width:890px;margin:0 auto;display:grid;grid-template-columns:224px 1fr;min-height:385px}.section-nav{background:var(--sidebar-bg);border-right:1px solid var(--line);padding:17px 12px}.section-nav h2{font-size:11px;font-weight:400;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:0 9px 9px}.section-row{height:28px;display:flex;align-items:center;padding:0 9px;margin-bottom:5px;border-radius:4px;color:var(--muted);font-size:12px}.section-row.selected{background:var(--control-selected);color:var(--control-selected-fg)}.section-row.focused{outline:1px solid var(--focus);outline-offset:-1px}.nav-divider{height:1px;background:var(--line);margin:12px 7px}.preferences-body{padding:20px 23px}.preferences-body h2{font-size:14px;font-weight:400;color:var(--bright);margin:0 0 3px}.preferences-body>p{font-size:12px;color:var(--faint);margin:0 0 18px}.setting{padding:11px 0;border-top:1px solid var(--soft-line);display:flex;align-items:center}.setting:first-of-type{border-top:0}.setting-copy{flex:1}.setting-name{font-size:12px;color:var(--text)}.setting-description{font-size:11px;color:var(--faint);margin-top:3px}.selectish{width:150px;height:29px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:var(--editor);font-size:12px;color:var(--text)}.comparison{max-width:890px;margin:17px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid-nav{padding:11px 12px;display:grid;grid-template-columns:1fr 1fr;gap:5px 7px}.grid-nav .section-row{margin:0}.legend{font-size:11px;color:var(--faint);padding:9px 12px 0}
