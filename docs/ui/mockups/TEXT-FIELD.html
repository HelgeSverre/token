<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Text field — Token UI reference</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .settings-window { max-width: 816px; margin: 0 auto; }
    .settings-content { display:grid; grid-template-columns:190px 1fr; min-height:350px; }
    .settings-nav { padding:15px 10px; border-right:1px solid var(--line); background:var(--sidebar-bg); }
    .nav-row { height:30px; display:flex; align-items:center; padding:0 10px; border-radius:4px; color:var(--muted); font-size:12px; }
    .nav-row.selected { background:var(--sidebar-selected); color:var(--sidebar-selected-fg); }
    .form-area { padding:19px 22px; }
    .form-area h2 { margin:0 0 2px; color:var(--bright); font-size:14px; font-weight:400; }
    .form-area > p { margin:0 0 16px; font-size:12px; color:var(--faint); }
    .setting-row { display:grid; grid-template-columns:154px minmax(0,1fr); gap:16px; align-items:start; margin:13px 0; }
    .setting-row label { padding-top:7px; color:var(--text); font-size:12px; }
    .field-stack { min-width:0; }
    .field-sample { position:relative; min-height:31px; display:flex; align-items:center; padding:0 9px; border:1px solid var(--line); border-radius:4px; background:var(--input-background, var(--editor)); color:var(--code-fg); font:12px/1.2 "JetBrains Mono", monospace; }
    .field-sample.focused { border-color:var(--focus); }
    .field-sample.invalid { border-color:var(--severity-error, var(--red)); }
    .field-sample.disabled { color:var(--faint); background:var(--control-bg); opacity:.62; }
    .caret { width:1px; height:15px; margin-left:1px; background:var(--chart-budget); }
    .selection { background:var(--control-selected); color:var(--control-selected-fg); margin:0 -1px; padding:1px; }
    .error { margin-top:5px; color:var(--severity-error-text, var(--red)); font-size:11px; }
    .field-help { margin-top:5px; color:var(--faint); font-size:11px; }
    .state-strip { width:816px; max-width:100%; margin:18px auto 0; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .compact-sample { padding:11px 12px; }
    .compact-sample .field-sample { margin-top:7px; }
    .field-sample.multiline { position:relative; align-items:flex-start; display:block; height:64px; padding:7px 8px; overflow:hidden; white-space:pre; font-size:11px; line-height:14px; }
    .field-sample.multiline .caret { display:inline-block; vertical-align:text-bottom; }
  </style>
</head>
<body>
<script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script>
<script>
  Mockup.mount({
    id: 'TEXT-FIELD', title: 'Text field',
    description: 'Settings owns field state and submit policy; the field projects an editable value, label and validation context.',
    status: 'Established surface · visual study',
    content: `
      <section class="window settings-window" aria-label="Settings text field context">
        <div class="surface-header"><span>Settings</span><span class="muted">Language servers</span></div>
        <div class="settings-content">
          <nav class="settings-nav" aria-label="Settings categories"><div class="nav-row">Appearance</div><div class="nav-row selected">Language servers</div><div class="nav-row">Files</div><div class="nav-row">Key bindings</div></nav>
          <form class="form-area" aria-label="Language server settings">
            <h2>rust-analyzer</h2><p>Command and arguments used when opening Rust files.</p>
            <div class="setting-row"><label for="command">Command</label><div class="field-stack"><div id="command" class="field-sample focused" role="textbox" aria-label="Command" aria-readonly="true">rust-analyzer<span class="caret" aria-hidden="true"></span></div><div class="field-help">Resolved from your PATH when no absolute path is provided.</div></div></div>
            <div class="setting-row"><label for="arguments">Arguments</label><div class="field-stack"><div id="arguments" class="field-sample" role="textbox" aria-label="Arguments" aria-readonly="true">--log-file /tmp/ra.log</div></div></div>
            <div class="setting-row"><label for="initialization">Initialization options</label><div class="field-stack"><div id="initialization" class="field-sample" role="textbox" aria-label="Initialization options" aria-readonly="true">{ \"checkOnSave\": <span class="selection">true</span> }</div></div></div>
          </form>
        </div>
      </section>
      <section class="state-strip" aria-label="Text field states">
        <div class="state-card compact-sample"><div class="state-label">Read-only</div><div class="field-sample" role="textbox" aria-label="Workspace path" aria-readonly="true">~/code/token-editor</div></div>
        <div class="state-card compact-sample"><div class="state-label">Invalid</div><div class="field-sample invalid" role="textbox" aria-label="Port" aria-readonly="true">not-a-port</div><div class="error">Enter a port from 1 to 65535.</div></div>
        <div class="state-card compact-sample"><div class="state-label">Disabled</div><div class="field-sample disabled" aria-label="Disabled proxy field">Inherited from workspace</div></div>
        <div class="state-card compact-sample"><div class="state-label">Multiline</div><div class="field-sample multiline focused" role="textbox" aria-multiline="true" aria-label="Initialization options JSON" data-clip-demo>{<span class="caret" aria-hidden="true"></span>
  "check": true,
  "command": "clippy"
}</div></div>
      </section>`
  });
</script>
</body></html>
