<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button · Token UI reference</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="ide.css"><script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script><script src="ide.js"></script></head>
<body><style>
  .button-main .ide-group:first-child { margin-block-start:0; } .button-main .ide-group-title { margin-block-end:6px; } .button-main .ide-form-row { grid-template-columns:138px minmax(0, 1fr); } .button-main .ide-action { display:flex; align-items:center; gap:9px; } .button-main .ide-action .ide-hint { margin:0; } .button-main .ide-footer .grow { min-inline-size:0; } .button-main .btn[data-state="hover"] { background:var(--hover); color:var(--bright); } .button-main .btn[data-state="pressed"] { background:var(--control-selected); color:var(--bright); border-color:var(--focus); } .button-main .ide-states { padding-block-start:6px; } .button-main .ide-state .state-label { margin-block-end:5px; } .button-main .ide-state-caption { margin-block-start:3px; line-height:14px; }
</style><script>
Mockup.mount({id:"BUTTON",title:"Button",status:"Established surface · visual study",description:"Compact actions in Token Settings; durable state and hit testing remain owned by the surrounding feature.",content:`
<div class="ide-study ide-context button-main"><div class="ide-scene"><div>${Ide.preferences({section:"Appearance",title:"Appearance",content:`
  <div class="ide-group"><div class="ide-group-title">Editor chrome</div><div class="ide-check-row"><input type="checkbox" checked aria-label="Show file icons"><span>Show file icons in document tabs</span></div><div class="ide-check-row ide-dependent"><input type="checkbox" checked aria-label="Use compact tabs"><span>Use compact tab labels</span></div></div>
  <div class="ide-group"><div class="ide-group-title">Actions</div><div class="ide-form-row"><span>Color scheme</span><div class="ide-action"><button class="btn" type="button">Restore defaults</button><span class="ide-hint">Restores Default Dark colors.</span></div></div><div class="ide-form-row"><span>Editor font</span><div class="ide-action"><button class="btn" type="button">Choose font…</button><span class="ide-hint">JetBrains Mono · 14 px</span></div></div></div>`,footer:`<span>Changes are staged for this preferences session.</span><span class="grow"></span><button class="btn quiet" type="button">Reset</button><button class="btn primary" type="button">Apply <span class="mono">⌘↵</span></button>`})}</div><aside class="ide-notes"><div class="ide-note"><h3>Feature-owned action</h3><p>The surrounding Settings form derives the rectangle, availability, hover, and message. The painter only projects them.</p></div><div class="ide-note"><h3>Quiet by default</h3><p>Use the primary treatment only for the form-level commit.</p></div></aside></div>
<div class="ide-states" style="--state-count:5" aria-label="Button paint states"><div class="ide-state"><span class="state-label">Normal</span><button class="btn" type="button">Choose font…</button><p class="ide-state-caption">Available action</p></div><div class="ide-state"><span class="state-label">Hover</span><button class="btn" data-state="hover" type="button">Choose font…</button><p class="ide-state-caption">Pointer over shared hit rect</p></div><div class="ide-state"><span class="state-label">Pressed + focus</span><button class="btn focused" data-state="pressed" type="button">Choose font…</button><p class="ide-state-caption">Capture and focus are caller-owned</p></div><div class="ide-state"><span class="state-label">Selected</span><button class="btn selected" type="button">Bold</button><p class="ide-state-caption">Segmented control / find-bar toggle; falls back to Pressed</p></div><div class="ide-state"><span class="state-label">Disabled</span><button class="btn" disabled type="button">Apply</button><p class="ide-state-caption">No activation is emitted</p></div></div></div>`});
</script></body></html>
