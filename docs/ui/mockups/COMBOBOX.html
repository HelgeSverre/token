<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editable ComboBox visual reference</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="ide.css">
    <style>
      .combo-preferences-wrap { position: relative; min-block-size: 0; }
      .combo-preferences-wrap > .ide-window { block-size: 100%; }
      .combo-open-row { min-block-size: 34px; }
      .combo-anchor { inline-size: 260px; min-block-size: 28px; }
      .combo-input { inline-size: 100%; block-size: 28px; display: grid; grid-template-columns: minmax(0, 1fr) 28px; align-items: center; border: 1px solid var(--focus); border-radius: 3px 3px 0 0; background: var(--input-background); box-shadow: 0 0 0 1px var(--focus); }
      .combo-input input { min-inline-size: 0; padding-inline: 8px; border: 0; outline: 0; background: transparent; color: var(--text); font: 12px var(--font-mono); }
      .combo-input button { block-size: 26px; border: 0; border-inline-start: 1px solid var(--line); background: var(--control-bg); color: var(--muted); }
      .combo-popup { position: absolute; z-index: 3; inset-inline-start: 348px; inset-block-start: 146px; inline-size: 260px; padding: 3px; border: 1px solid var(--focus); border-radius: 0 0 3px 3px; background: var(--tooltip-bg); box-shadow: 0 8px 16px #00000055; }
      .combo-option { inline-size: 100%; min-block-size: 27px; display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; gap: 5px; padding-inline: 6px; border: 0; border-radius: 2px; background: transparent; color: var(--text); font: 12px var(--font-mono); text-align: left; }
      .combo-option.active { color: var(--control-selected-fg); background: var(--control-selected); }
      .combo-option[aria-disabled="true"] { color: var(--faint); }
      .combo-check { display: flex; justify-content: center; color: var(--bright); }
      .combo-states { --state-count: 3; }
      .combo-mini { inline-size: min(100%, 206px); min-block-size: 28px; display: grid; grid-template-columns: minmax(0, 1fr) 28px; align-items: center; padding-inline-start: 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--input-background); color: var(--text); font: 12px var(--font-mono); }
      .combo-mini svg { justify-self: center; color: var(--faint); }
      .combo-mini.invalid { border-color: var(--severity-error); }
      .combo-error { margin-block-start: 5px; color: var(--severity-error-text); font-size: 11px; line-height: 16px; }
    </style>
  </head>
  <body>
    <script src="../../../prototypes/debug-performance-themes.js"></script>
    <script src="shared.js"></script>
    <script src="ide.js"></script>
    <script>
      const option = (label, { active = false, disabled = false } = {}) => `
        <button class="combo-option${active ? ' active' : ''}" type="button" role="option"${active ? ' aria-selected="true"' : ''}${disabled ? ' aria-disabled="true"' : ''}>
          <span class="combo-check">${active ? Mockup.icon('check', 13) : ''}</span><span>${label}</span>
        </button>`;
      const content = `
        <div class="ide-study">
          <div class="ide-scene">
            <div class="combo-preferences-wrap">
            ${Ide.preferences({
              section: 'Language servers',
              title: 'Inline provider',
              content: `
                <section class="ide-group" aria-label="Provider configuration">
                  <div class="ide-group-title">Provider</div>
                  <div class="ide-form-row combo-open-row"><label for="provider">Provider</label>
                    <div class="combo-anchor">
                      <div class="combo-input" role="combobox" aria-expanded="true" aria-controls="provider-options" aria-label="Provider">
                        <input id="provider" value="local-runner" readonly><button type="button" aria-label="Show provider options">${Mockup.icon('chevron-down', 14)}</button>
                      </div>
                    </div>
                  </div>
                  <div class="ide-form-row"><label for="provider-model">Model</label><div id="provider-model" class="field ide-control-width mono">qwen2.5-coder:14b</div></div>
                </section>`
            })}
            <div class="combo-popup" id="provider-options" role="listbox" aria-label="Provider options">
              ${option('local-runner', { active: true })}${option('ollama')}${option('openai-compatible')}${option('remote-session', { disabled: true })}
            </div></div>
            <aside class="ide-notes" aria-label="Editable ComboBox study notes">
              <section class="ide-note"><h3>Draft</h3><p>The field holds editable draft text while the list supplies source-owned options.</p></section>
              <section class="ide-note"><h3>Preview and commit</h3><p>Navigation previews an enabled option. The owner validates and persists only an explicit commit.</p></section>
            </aside>
          </div>
          <div class="ide-states combo-states" aria-label="Editable ComboBox visual states">
            <section class="ide-state"><div class="state-label">Known option</div><div class="combo-mini"><span>ollama</span>${Mockup.icon('chevron-down', 14)}</div></section>
            <section class="ide-state"><div class="state-label">Custom draft</div><div class="combo-mini"><span>my-provider</span>${Mockup.icon('chevron-down', 14)}</div></section>
            <section class="ide-state"><div class="state-label">Validation after save</div><div class="combo-mini invalid"><span>remote-session</span>${Mockup.icon('chevron-down', 14)}</div><div class="combo-error">Provider endpoint is required.</div></section>
          </div>
        </div>`;
      Mockup.mount({ id: 'COMBOBOX', title: 'Editable ComboBox', description: 'A proposed editable Settings field with source-owned options and a transient popup preview.', status: 'Proposed component', content });
    </script>
  </body>
</html>
