<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Search field — Token UI reference</title><link rel="stylesheet" href="shared.css">
<style>
 .search-context{max-width:930px;margin:0 auto}.editor-copy{height:248px;position:relative;background:var(--editor);padding:12px 28px 12px 68px;border-top:1px solid var(--line);font:12.5px/20px "JetBrains Mono",monospace;color:var(--code-fg)}
 .gutter{position:absolute;inset:10px auto 10px 0;width:49px;text-align:right;padding-right:12px;color:var(--gutter-fg);font:12px/20px "JetBrains Mono",monospace;border-right:1px solid var(--line)}.match{background:color-mix(in srgb,var(--chart-budget) 31%,transparent);color:var(--bright)}.active-match{background:var(--control-selected);color:var(--bright)}
 .findbar{padding:10px 12px 11px;background:var(--panel);display:grid;grid-template-columns:auto minmax(250px,1fr) auto auto auto auto auto;gap:8px;align-items:center}.findbar.replace{grid-template-columns:auto minmax(250px,1fr) auto auto auto auto auto}.find-label{font-size:12px;color:var(--muted)}.search-input{height:29px;display:flex;align-items:center;gap:7px;padding:0 8px;border:1px solid var(--focus);box-shadow:0 0 0 1px var(--focus);border-radius:4px;background:var(--input-background,var(--editor));font:12px "JetBrains Mono",monospace;color:var(--code-fg)}.search-input .query{min-width:0;flex:1}.search-input .clear{border:0;background:transparent;color:var(--faint);padding:1px}.option{height:27px;min-width:27px;border:1px solid var(--line);border-radius:4px;background:var(--control-bg);color:var(--muted);font:11px "Inter",sans-serif}.option.on{background:var(--control-selected);border-color:var(--control-selected-border);color:var(--bright)}.find-result{white-space:nowrap;font-size:11px;color:var(--faint)}.find-actions{display:flex;gap:3px}.find-actions .btn{min-width:28px;padding:0 7px;height:28px}.states{max-width:930px;margin:18px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini-find{padding:11px 12px}.mini-search{height:30px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--editor);border-radius:4px;padding:0 8px;font:12px "JetBrains Mono",monospace}.mini-search.empty{color:var(--faint);font-family:Inter,sans-serif}.scope{font-size:11px;color:var(--faint);margin-top:7px}
</style></head><body><script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script><script>
Mockup.mount({id:'SEARCH-FIELD',title:'Search field',description:'Document Find binds a query to results, options and navigation; its chrome does not turn picker search into the same state machine.',status:'Established surface · visual study',content:`
 <section class="window search-context" aria-label="Editor with Find">
  <div class="surface-header"><span class="mono">src/view/find_bar.rs</span><span class="muted">Rust</span></div>
  <div class="findbar" role="search" aria-label="Find in document"><span class="find-label">Find</span><div class="search-input" role="searchbox" aria-label="Find query" aria-readonly="true">${Mockup.icon('search')}<span class="query">find</span><button class="clear" aria-label="Clear query">${Mockup.icon('close')}</button></div><span class="find-result">2 of 6</span><div class="find-actions"><button class="btn icon-btn" aria-label="Previous match">${Mockup.icon('chevron-up')}</button><button class="btn icon-btn" aria-label="Next match">${Mockup.icon('chevron-down')}</button></div><button class="option on" aria-label="Match case enabled">Aa</button><button class="option" aria-label="Whole word disabled">ab</button><button class="option" aria-label="Use regular expression disabled">.*</button></div>
  <div class="editor-copy"><div class="gutter">114<br>115<br>116<br>117<br>118<br>119<br>120<br>121<br>122<br>123<br>124</div>
   <div><span class="muted">pub fn</span> render_find_bar(<span class="muted">session</span>: &amp;RenderSession) {</div><div>&nbsp;&nbsp;<span class="muted">let</span> query = state.<span class="match">find</span>.query();</div><div>&nbsp;&nbsp;<span class="muted">let</span> result = search_document(document, query);</div><div>&nbsp;&nbsp;<span class="active-match">find</span>_layout.render(result, session);</div><div>&nbsp;&nbsp;<span class="muted">if</span> state.<span class="match">find</span>.replace_mode {</div><div>&nbsp;&nbsp;&nbsp;&nbsp;render_replace_field(session);</div><div>&nbsp;&nbsp;}</div><div>}</div>
  </div>
 </section>
 <section class="states" aria-label="Search field variants"><div class="state-card mini-find"><div class="state-label">Picker header · empty query</div><div class="mini-search empty">${Mockup.icon('search')} Search commands</div><div class="scope">Feature-owned filtering, no document match ordinal.</div></div><div class="state-card mini-find"><div class="state-label">Find selection scope</div><div class="mini-search">${Mockup.icon('search')} render</div><div class="scope">12 matches in selected text · case sensitive</div></div></section>`});
</script></body></html>
