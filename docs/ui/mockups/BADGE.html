<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Badge · Token UI reference</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="ide.css"><style>

<div class="ide-study"><div class="ide-scene badge-scene"><section class="ide-window ide-context" aria-label="Token editor with Problems tool window"><header class="ide-titlebar"><span>Token</span><span class="ide-path">src/view/renderer.rs</span><span class="grow"></span><button class="btn quiet icon-btn" aria-label="Split editor">${Mockup.icon('split')}</button><button class="btn quiet icon-btn" aria-label="More editor actions">${Mockup.icon('more')}</button></header><div class="badge-editor"><div class="editor-tabs"><div class="editor-tab active">${Mockup.icon('file',14)} renderer.rs</div><div class="editor-tab">${Mockup.icon('file',14)} frame.rs</div><span class="grow"></span></div>${Mockup.code({start:118,active:122,lines:['pub fn render_status(&mut self, model: &AppModel) {','    let problems = problems_rows(model);','    self.draw_problems(problems);','}','', 'fn completion_kind(item: &CompletionItem) -> MenuItemKind {','    item.kind.unwrap_or(MenuItemKind::Other)','}']})}</div><section class="badge-problems" aria-label="Problems tool window"><header class="badge-problems-head">${Mockup.icon('warning',15)} <span>Problems</span><span class="badge">3</span><span class="badge-filter">Workspace</span><span class="grow"></span><button class="btn quiet icon-btn" aria-label="Filter problems">${Mockup.icon('filter')}</button><button class="btn quiet icon-btn" aria-label="Problems options">${Mockup.icon('more')}</button></header><div class="badge-diagnostic selected"><span class="severity error">${Mockup.icon('error',15)}</span><span>missing field <span class="mono">current_file_only</span></span><span class="detail">renderer.rs</span><span class="detail">Ln 122</span></div><div class="badge-diagnostic"><span class="severity error">${Mockup.icon('error',15)}</span><span>cannot borrow <span class="mono">frame</span> as mutable</span><span class="detail">frame.rs</span><span class="detail">Ln 418</span></div><div class="badge-diagnostic"><span class="severity warning">${Mockup.icon('warning',15)}</span><span>unused result from <span class="mono">measure_stage</span></span><span class="detail">perf.rs</span><span class="detail">Ln 84</span></div></section><footer class="status-bar">${Mockup.icon('git-branch',12)} main<span class="grow"></span><span>Ln 122, Col 9</span><span>Rust</span></footer></section><aside class="ide-notes"><div class="ide-note"><h3>Current completion mark</h3><p>Completion rows reserve a 16px leading slot for a semantic <span class="mono">MenuItemKind</span> glyph. The selected row owns interaction.</p></div><div class="ide-note"><h3>Counts are projections</h3><p>The Problems header count and severities describe the collection; neither is a button or durable status object.</p></div></aside></div><div class="ide-states" style="--state-count:3"><div class="ide-state"><div class="state-label">Completion kind · current</div><div class="row"><span class="kind-mark">f</span><span class="mono muted">render_status</span><span class="dim">Function</span></div><p class="ide-state-caption">16px square, supplied by the completion item.</p></div><div class="ide-state"><div class="state-label">Completion kind · current</div><div class="row"><span class="kind-mark method">M</span><span class="mono muted">measure_stage</span><span class="dim">Method</span></div><p class="ide-state-caption">Same background role; distinct discriminator.</p></div><div class="ide-state"><div class="state-label">Proposed count policy</div><div class="row"><span class="badge">99+</span><span class="muted">Problems</span></div><p class="ide-state-caption">A count pill needs its own measured overflow policy.</p></div></div></div>`});
</script></body></html>
