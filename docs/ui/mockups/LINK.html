<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Link · Token UI reference</title><link rel="stylesheet" href="shared.css"><style>
  .link-demo{height:414px;display:grid;grid-template-columns:1fr 325px;overflow:hidden}.terminal{background:#171717;padding:14px 0;font-family:var(--font-code);font-size:12px;line-height:22px;color:var(--code-fg)}.terminal-head{display:flex;align-items:center;gap:8px;padding:0 14px 10px;color:var(--faint);font-family:var(--font-ui);font-size:11px;border-bottom:1px solid #2b2b2b;margin-bottom:10px}.term-row{padding:0 14px}.term-prompt{color:var(--teal)}.term-link{color:#73b8ff;text-decoration:underline;text-underline-offset:2px}.term-muted{color:var(--faint)}.link-side{padding:15px;background:var(--panel);border-left:1px solid var(--line)}.link-side h3{font-size:13px;font-weight:400;color:var(--text);margin:0 0 5px}.link-side p{font-size:12px;color:var(--faint);line-height:17px;margin:0 0 14px}.link-button{display:inline-flex;gap:5px;align-items:center;color:#73b8ff;font-size:12px;text-decoration:none;border-bottom:1px solid #73b8ff66;padding-bottom:1px}.link-button.focused{outline:1px solid var(--focus);outline-offset:3px;border-radius:1px}.link-rule{margin:16px 0}.link-states{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.link-state{border:1px solid var(--line);background:var(--panel);padding:10px 12px}.link-state a{display:inline-flex;margin-top:5px}.link-state p{font-size:11px;color:var(--faint);margin:5px 0 0;line-height:15px}.disabled-link{color:var(--faint);text-decoration:none;pointer-events:none}
</style></head><body><script src="../../../prototypes/debug-performance-themes.js"></script><script src="shared.js"></script><script>
Mockup.mount({id:'LINK',title:'Link',description:'Current terminal URLs are grid-aware. A generic internal or external UI link remains a proposed component.',status:'Proposed component',content:`
<section class="window link-demo" aria-label="Terminal link and proposed settings links"><div class="terminal"><div class="terminal-head">${Mockup.icon('terminal')} terminal · modifier held shows a validated web link</div><div class="term-row"><span class="term-prompt">$</span> cargo test</div><div class="term-row">test result: ok. 842 passed; 0 failed</div><div class="term-row"><span class="term-muted">Docs: </span><a class="term-link" href="https://docs.rs" aria-label="Terminal web link to docs.rs">https://docs.rs/token-editor</a></div><div class="term-row"><span class="term-muted">Open with ⌘-click after terminal resolves this grid range again.</span></div><div class="term-row"><span class="term-muted">16-col wrap, trailing punctuation: </span><a class="term-link" href="https://example.com/a(b)" aria-label="Wrapped terminal link, resolves to https://example.com/a(b) with trailing close-paren and period trimmed">(https://example.com/a<br>(b)).</a></div><div class="term-row" style="margin-top:18px"><span class="term-prompt">$</span> git status --short</div><div class="term-row"> M src/view/frame.rs</div></div><aside class="link-side"><h3>Help and resources</h3><p>Illustrative generic links use a small visible hit area, distinct focus, and a validated destination.</p><a class="link-button focused" href="https://example.invalid" aria-label="Open keyboard shortcut help">Keyboard shortcuts ${Mockup.icon('arrow-right')}</a><div class="separator link-rule"></div><a class="link-button" href="https://example.invalid" aria-label="Open rendering documentation">Rendering documentation ${Mockup.icon('arrow-right')}</a><p style="margin-top:16px" class="help">Primary actions such as Save remain buttons; only navigation becomes a link.</p></aside></section><div class="link-states"><div class="link-state"><div class="state-label">Current terminal</div><a class="link-button" href="https://example.invalid">https://docs.rs ${Mockup.icon('link')}</a><p>Grid range + modifier policy.</p></div><div class="link-state"><div class="state-label">Proposed focused UI link</div><a class="link-button focused" href="https://example.invalid">Open help ${Mockup.icon('arrow-right')}</a><p>Visible focus without a full-row hit area.</p></div><div class="link-state"><div class="state-label">Proposed disabled</div><a class="link-button disabled-link" aria-disabled="true">No documentation available</a><p>Owner removes it from traversal.</p></div></div>`});
</script></body></html>
